<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><?= appName ?></title>
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
  :root {
    --navy: #0f2942;
    --blue: #1b629b;
    --sky: #2563eb;
    --indigo: #4f46e5;
    --teal: #0d9488;
    --emerald: #059669;
    --coral: #ea580c;
    --violet: #7c3aed;
    --amber: #d97706;
    --rose: #e11d48;
    --cyan: #0284c7;
    --pale: #f0f7ff;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --line: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
    --good: #10b981;
    --warn: #f59e0b;
    --bad: #ef4444;
    --shadow-sm: 0 2px 6px rgba(15, 41, 66, 0.06);
    --shadow-md: 0 4px 14px rgba(15, 41, 66, 0.10);
    --shadow-lg: 0 16px 40px rgba(15, 41, 66, 0.20);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-full: 9999px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font: 15px/1.5 Arial, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  button, input, select, textarea {
    font: inherit;
  }

  .hidden {
    display: none !important;
  }

  .loading {
    display: grid;
    place-items: center;
    height: 100vh;
    color: var(--blue);
    font-weight: 700;
    font-size: 18px;
  }

  .app {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 260px 1fr;
  }

  .sidebar {
    background: var(--navy);
    color: #ffffff;
    padding: 22px 14px;
    display: flex;
    flex-direction: column;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 8px 22px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    margin-bottom: 14px;
  }

  .brand-mark {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: #ffffff;
    color: var(--navy);
    font-weight: 800;
    font-size: 16px;
    box-shadow: var(--shadow-sm);
  }

  .brand small {
    display: block;
    color: #c7d7e5;
    font-size: 12px;
  }

  .sidebar nav {
    display: grid;
    gap: 4px;
  }

  .sidebar nav button {
    border: 0;
    background: transparent;
    color: #dbe8f2;
    text-align: left;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    font-weight: 500;
  }

  .sidebar nav button:hover,
  .sidebar nav button.active {
    background: rgba(255, 255, 255, 0.15);
    color: #ffffff;
    font-weight: 700;
  }

  .version {
    margin-top: auto;
    padding: 12px 8px;
    color: #c7d7e5;
    font-size: 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
  }

  main {
    padding: 0 32px 48px;
    min-width: 0;
  }

  header {
    height: 92px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }

  h1 {
    margin: 0;
    color: var(--navy);
    font-size: 26px;
    font-weight: 700;
  }

  header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  .user-badge {
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: var(--radius-full);
    padding: 8px 14px;
    font-size: 13px;
    color: var(--navy);
    font-weight: 600;
    box-shadow: var(--shadow-sm);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(150px, 1fr));
    gap: 14px;
    margin: 20px 0;
  }

  .card {
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 18px;
    box-shadow: var(--shadow-sm);
  }

  .kpi strong {
    display: block;
    font-size: 28px;
    color: var(--navy);
    line-height: 1.2;
  }

  .kpi span {
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
    display: block;
  }

  .panel {
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    margin-top: 20px;
    padding: 22px;
    box-shadow: var(--shadow-sm);
  }

  .panel h2 {
    margin: 0 0 16px;
    color: var(--navy);
    font-size: 20px;
    font-weight: 700;
  }

  .panel-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .panel-head h2 {
    margin-bottom: 4px;
  }

  .muted {
    color: var(--muted);
    margin: 0;
    font-size: 14px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(220px, 1fr));
    gap: 14px;
  }

  .field label {
    display: block;
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 6px;
    color: var(--text);
  }

  .field input,
  .field select,
  .field textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #adbdca;
    border-radius: var(--radius-sm);
    background: #ffffff;
    color: var(--text);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    outline: none;
    border-color: var(--sky);
    box-shadow: 0 0 0 3px rgba(47, 125, 188, 0.18);
  }

  .field textarea {
    min-height: 90px;
    resize: vertical;
  }

  .field-wide {
    grid-column: 1 / -1;
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    align-items: center;
  }

  .actions.compact {
    margin: 0;
  }

  .btn {
    border: 0;
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.05s active;
  }

  .btn-primary {
    background: var(--blue);
    color: #ffffff;
  }

  .btn-primary:hover {
    background: var(--navy);
  }

  .btn-secondary {
    background: var(--pale);
    color: var(--navy);
  }

  .btn-secondary:hover {
    background: #dbeaf6;
  }

  .btn-small {
    padding: 6px 10px;
    font-size: 12px;
  }

  .btn-link {
    border: 0;
    background: transparent;
    color: var(--blue);
    font-weight: 700;
    cursor: pointer;
    padding: 6px;
    text-decoration: underline;
    font-size: 13px;
  }

  .btn-link:hover {
    color: var(--navy);
  }

  .btn-link.danger {
    color: var(--bad);
  }

  .btn:disabled,
  .pagination button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .alert {
    padding: 12px 16px;
    margin-top: 16px;
    border-radius: var(--radius-sm);
    background: #fff4e5;
    color: var(--warn);
    font-weight: 600;
    font-size: 14px;
  }

  .alert.error {
    background: #feeceb;
    color: var(--bad);
  }

  .alert.ok {
    background: #e9f7ef;
    color: var(--good);
  }

  #alert {
    position: fixed;
    right: 24px;
    top: 20px;
    z-index: 3000;
    max-width: min(560px, calc(100vw - 48px));
    box-shadow: var(--shadow-lg);
  }

  .busy-overlay {
    position: fixed;
    inset: 0;
    z-index: 2500;
    background: rgba(244, 247, 250, 0.75);
    backdrop-filter: blur(2px);
    display: grid;
    place-items: center;
  }

  .busy-card {
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 22px 30px;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--navy);
    font-weight: 700;
  }

  .spinner {
    width: 24px;
    height: 24px;
    border: 3px solid var(--pale);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .table-wrap {
    overflow-x: auto;
    margin: 12px 0;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th, td {
    padding: 11px 12px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: middle;
  }

  th {
    background: var(--blue);
    color: #ffffff;
    font-weight: 700;
    white-space: nowrap;
  }

  tr:last-child td {
    border-bottom: 0;
  }

  tr:hover td {
    background: #fbfdff;
  }

  .empty {
    padding: 32px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  .tag {
    display: inline-block;
    padding: 3px 9px;
    border-radius: var(--radius-full);
    background: var(--pale);
    color: var(--navy);
    font-size: 12px;
    font-weight: 600;
  }

  .tag-group, .row-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filters {
    display: flex;
    gap: 10px;
    align-items: center;
    margin: 18px 0;
    flex-wrap: wrap;
  }

  .filters input, .filters select {
    min-height: 42px;
    padding: 9px 12px;
    border: 1px solid #adbdca;
    border-radius: var(--radius-sm);
    background: #ffffff;
  }

  .filters input {
    flex: 1;
    min-width: 240px;
  }

  .search-row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }

  .search-row input {
    flex: 1;
    padding: 11px 14px;
    border: 1px solid #adbdca;
    border-radius: var(--radius-sm);
  }

  .result-count {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 8px;
  }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 16px;
    font-size: 13px;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(150px, 1fr));
    gap: 12px;
    margin-top: 20px;
  }

  .detail {
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px;
    background: #fbfdff;
  }

  .detail span {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 4px;
  }

  .detail strong {
    overflow-wrap: anywhere;
    color: var(--text);
  }

  .counter {
    display: grid;
    place-items: center;
    min-width: 30px;
    height: 30px;
    padding: 0 6px;
    border-radius: var(--radius-full);
    background: var(--pale);
    color: var(--navy);
    font-weight: 700;
    font-size: 13px;
  }

  .relation-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }

  .relation-row:last-child {
    border-bottom: 0;
  }

  .relation-row small, .cell-subtitle {
    display: block;
    color: var(--muted);
    margin-top: 3px;
    font-size: 12px;
  }

  /* Status Tags */
  .status-activo, .status-vigente, .status-asistio, .status-admisible,
  .status-recibido, .status-habilitado, .status-completo, .status-consolidacion, .status-finalizada {
    background: #e9f7ef;
    color: var(--good);
  }

  .status-inactivo, .status-rechazado, .status-vencido, .status-inadmisible,
  .status-no_habilitado, .status-incompleto, .status-cancelada, .status-retirada {
    background: #feeceb;
    color: var(--bad);
  }

  .status-posible_duplicado, .status-observado, .status-pendiente,
  .status-borrador, .status-recibida, .status-en_revision, .status-por_vencer,
  .status-arranque, .status-estacional, .status-suspendido {
    background: #fff4e5;
    color: var(--warn);
  }

  .status-subsanable, .status-en_ejecucion, .status-desarrollo {
    background: var(--pale);
    color: var(--blue);
  }

  .status-reemplazado, .status-cerrado {
    background: #eef1f4;
    color: #536273;
  }

  /* Ficha Integral Hero */
  .ficha-hero {
    background: linear-gradient(135deg, #163f63, #246998);
    color: #ffffff;
    border: 0;
    border-radius: var(--radius-md);
    padding: 24px;
    box-shadow: var(--shadow-md);
  }

  .ficha-hero h2, .ficha-hero .muted {
    color: #ffffff;
  }

  .ficha-hero .muted {
    opacity: 0.88;
  }

  .ficha-status {
    display: grid;
    grid-template-columns: repeat(3, minmax(160px, 1fr));
    gap: 12px;
    margin-top: 18px;
  }

  .ficha-status .detail {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.25);
  }

  .ficha-status .detail span, .ficha-status .detail strong {
    color: #ffffff;
  }

  .section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .section-title h2 {
    margin: 0;
  }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(180px, 1fr));
    gap: 12px;
  }

  .info-item {
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: #fbfdff;
  }

  .info-item span {
    display: block;
    color: var(--muted);
    font-size: 12px;
  }

  .info-item strong {
    display: block;
    margin-top: 4px;
    overflow-wrap: anywhere;
  }

  .doc-state-note {
    border-left: 4px solid var(--good);
    background: #e9f7ef;
    padding: 14px;
    border-radius: var(--radius-sm);
    margin-top: 14px;
    font-size: 14px;
  }

  .subnav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 14px;
  }

  .timeline-row {
    display: grid;
    grid-template-columns: 150px 1fr auto;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }

  .add-box {
    margin-top: 18px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 16px;
    background: #fbfdff;
  }

  .add-box summary {
    cursor: pointer;
    font-weight: 700;
    color: var(--blue);
  }

  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(260px, 1fr));
    gap: 16px;
  }

  .chart-card {
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 18px;
    box-shadow: var(--shadow-sm);
  }

  .chart-row {
    display: grid;
    grid-template-columns: minmax(110px, 1fr) 2fr 40px;
    align-items: center;
    gap: 10px;
    margin: 11px 0;
  }

  .chart-label {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 13px;
  }

  .chart-track {
    height: 11px;
    background: #e8eef3;
    border-radius: var(--radius-full);
    overflow: hidden;
  }

  .chart-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--sky), var(--navy));
    border-radius: var(--radius-full);
  }

  .quick-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
  }

  .help-box {
    background: #f5f9fc;
    border: 1px solid var(--line);
    border-left: 4px solid var(--sky);
    padding: 14px;
    border-radius: var(--radius-sm);
    margin: 14px 0;
  }

  .help-box strong {
    color: var(--navy);
  }

  .help-box p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(16, 44, 67, 0.65);
    display: grid;
    place-items: center;
    padding: 20px;
    z-index: 1000;
  }

  .modal-card {
    width: min(520px, 100%);
    background: #ffffff;
    border-radius: var(--radius-lg);
    padding: 24px;
    box-shadow: var(--shadow-lg);
  }

  .modal-card h2 {
    margin: 0 0 6px;
    color: var(--navy);
  }

  .master-results {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 26px;
    margin-top: 22px;
  }

  .master-results section {
    min-width: 0;
  }

  /* Selección masiva y herramientas de agilidad */
  .selection-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 12px 18px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
    flex-wrap: wrap;
    gap: 12px;
  }

  .selection-counter {
    font-weight: 700;
    font-size: 15px;
    color: var(--navy);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .selection-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* Badges de priorización y ayudas */
  .badge-priority {
    background: #d1fae5;
    color: #065f46;
    border: 1px solid #a7f3d0;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: var(--radius-full);
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .badge-history {
    background: #f1f5f9;
    color: #475569;
    border: 1px solid #cbd5e1;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: var(--radius-full);
    font-size: 12px;
  }

  .badge-help {
    background: #ede9fe;
    color: #5b21b6;
    border: 1px solid #ddd6fe;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: var(--radius-full);
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  /* Modal de métricas de seguimiento */
  .metric-modal-card {
    width: min(640px, 100%);
    background: #ffffff;
    border-radius: var(--radius-lg);
    padding: 24px 28px;
    box-shadow: var(--shadow-lg);
    max-height: 90vh;
    overflow-y: auto;
  }

  .metric-modal-header {
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
    margin-bottom: 18px;
  }

  .follower-calc-badge {
    font-size: 13px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 6px;
    margin-top: 6px;
    display: inline-block;
  }

  .follower-calc-positive {
    background: #dcfce7;
    color: #15803d;
  }

  .follower-calc-neutral {
    background: #f1f5f9;
    color: #475569;
  }

  /* Tarjetas y Dashboard Especializado de Mercados */
  .metric.accent-indigo { border-top: 4px solid var(--indigo); }
  .metric.accent-teal { border-top: 4px solid var(--teal); }
  .metric.accent-coral { border-top: 4px solid var(--coral); }
  .metric.accent-violet { border-top: 4px solid var(--violet); }
  .metric.accent-emerald { border-top: 4px solid var(--emerald); }
  .metric.accent-amber { border-top: 4px solid var(--amber); }

  .market-dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .market-charts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }

  .chart-box {
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 16px;
    box-shadow: var(--shadow-sm);
  }

  .chart-box h3 {
    margin: 0 0 12px;
    font-size: 15px;
    color: var(--navy);
  }

  /* Validación de RUT y Alertas de Duplicados en Vivo */
  .rut-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    margin-top: 4px;
  }
  .rut-badge.valid {
    background: #dcfce7;
    color: #15803d;
    border: 1px solid #bbf7d0;
  }
  .rut-badge.invalid {
    background: #fee2e2;
    color: #b91c1c;

  <script>
  // ===== Scripts.html =====
  // SGE v2.1.0 - Ficha integral del emprendedor
  // Controlador frontend, enrutamiento de vistas y comunicación RPC con Google Apps Script

  const state = {
    boot: null,
    view: 'inicio',
    pending: 0,
    alertTimer: null
  };

  const SUBRUBROS_POR_RUBRO = {
    ALIMENTACION: ['COMIDA_PREPARADA', 'COLACIONES_COFFEE_BREAK', 'PANADERIA_PASTELERIA', 'REPOSTERIA', 'PRODUCTOS_GOURMET', 'CONSERVAS_ENCURTIDOS', 'BEBESTIBLES'],
    ARTESANIA: ['ARTESANIA_TRADICIONAL', 'CERAMICA_ALFARERIA', 'MADERA', 'CUERO', 'JOYERIA_BISUTERIA', 'TEJIDOS', 'DECORACION_HOGAR', 'ILUSTRACION_DISENO'],
    TEXTIL: ['CONFECCION_VESTUARIO', 'TEJIDOS', 'BOLSOS_ACCESORIOS_TEXTILES', 'CALZADO'],
    BELLEZA_CUIDADO_PERSONAL: ['COSMETICA_NATURAL', 'PELUQUERIA_BARBERIA', 'MANICURE_ESTETICA', 'BIENESTAR_CUIDADO_PERSONAL'],
    COMERCIO: ['ALMACEN_REGALERIA', 'LIBRERIA_PAPELERIA', 'REVENTA_COMERCIO'],
    SERVICIOS: ['ASESORIAS_PROFESIONALES', 'SERVICIOS_PERSONALES', 'OFICIOS_REPARACIONES'],
    TECNOLOGIA: ['DESARROLLO_WEB_SOFTWARE', 'MARKETING_DISENO_DIGITAL', 'TECNOLOGIA_SERVICIOS_DIGITALES'],
    TURISMO: ['TURISMO_EXPERIENCIAS', 'GASTRONOMIA_TURISTICA'],
    ECONOMIA_CIRCULAR: ['RECICLAJE_REUTILIZACION', 'PRODUCTOS_SUSTENTABLES'],
    OTRO: ['OTRO']
  };

  const DOCUMENTOS_FICHA_V210 = [
    { codigo: 'CEDULA_IDENTIDAD_COMPLETA', etiqueta: 'Cédula por ambos lados (único archivo)', sujeto: 'PERSONA', obligatorio: true },
    { codigo: 'REGISTRO_SOCIAL_HOGARES', etiqueta: 'Registro Social de Hogares', sujeto: 'PERSONA', obligatorio: true },
    { codigo: 'ACREDITACION_DISCAPACIDAD', etiqueta: 'Credencial de discapacidad o pensión de invalidez', sujeto: 'PERSONA', obligatorio: false },
    { codigo: 'INICIO_ACTIVIDADES', etiqueta: 'Certificado inicio de actividades', sujeto: 'EMPRENDIMIENTO', obligatorio: false, mercado: true },
    { codigo: 'FICHA_TECNICA_PRODUCTOS', etiqueta: 'Ficha técnica de productos o servicios', sujeto: 'EMPRENDIMIENTO', obligatorio: false }
  ];

  const $ = function(selector) { return document.querySelector(selector); };

  function beginBusy(text) {
    state.pending++;
    if ($('#busyText')) $('#busyText').textContent = text || 'Procesando…';
    const busy = $('#busy');
    if (busy) busy.classList.remove('hidden');
  }

  function endBusy() {
    state.pending = Math.max(0, state.pending - 1);
    if (!state.pending) {
      const busy = $('#busy');
      if (busy) busy.classList.add('hidden');
    }
  }

  function call(name) {
    const args = Array.prototype.slice.call(arguments, 1);
    beginBusy();
    return new Promise(function(resolve, reject) {
      google.script.run
        .withSuccessHandler(function(response) {
          endBusy();
          resolve(response);
        })
        .withFailureHandler(function(error) {
          endBusy();
          reject(error);
        })[name].apply(google.script.run, args);
    });
  }

  function callForm(name, form) {
    beginBusy('Cargando archivo…');
    return new Promise(function(resolve, reject) {
      google.script.run
        .withSuccessHandler(function(response) {
          endBusy();
          resolve(response);
        })
        .withFailureHandler(function(error) {
          endBusy();
          reject(error);
        })[name](form);
    });
  }

  function hasPerm(perm) {
    const p = (state.boot && state.boot.permisos) || [];
    return p.indexOf('*') >= 0 || p.indexOf(perm) >= 0;
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>'"]/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c];
    });
  }

  function alertMsg(message, type) {
    type = type || 'ok';
    const el = $('#alert');
    if (!el) return;
    el.textContent = message;
    el.className = 'alert ' + type;
    clearTimeout(state.alertTimer);
    state.alertTimer = setTimeout(function() { el.classList.add('hidden'); }, 7000);
  }

  function assertOk(response) {
    if (!response || !response.ok) throw new Error((response && response.error && response.error.message) || 'Ocurrió un error');
    return response.data;
  }

  async function init() {
    try {
      state.boot = assertOk(await call('apiBootstrap'));
      $('#userBadge').textContent = state.boot.usuario.EMAIL + ' · ' + state.boot.usuario.ROL;
      $('#loading').classList.add('hidden');
      $('#app').classList.remove('hidden');
      render('inicio');
    } catch (error) {
      $('#loading').textContent = 'No fue posible iniciar el sistema: ' + error.message;
    }
  }

  document.addEventListener('click', function(e) {
    const button = e.target.closest('[data-view]');
    if (button) render(button.dataset.view);
  });

  function setActive(view, title) {
    state.view = view;
    document.querySelectorAll('[data-view]').forEach(function(b) {
      b.classList.toggle('active', b.dataset.view === view);
    });
    $('#viewTitle').textContent = title;
  }

  function render(view) {
    const routes = {
      inicio: renderInicio,
      registro: renderRegistroCompleto,
      buscar: renderBuscar,
      emprendedores: renderEmprendedores,
      personas: renderPersonas,
      emprendimientos: renderEmprendimientos,
      iniciativas: renderIniciativas,
      postulaciones: renderPostulaciones,
      seleccion: renderSeleccionV2,
      documentos: renderDocumentosHub,
      participacion: renderParticipacionV2,
      comunicaciones: renderComunicacionesV2,
      mapa: function() { renderInfo('Mapa', 'La geocodificación queda disponible para direcciones registradas.'); },
      reportes: renderInicio,
      auditoria: renderAuditoria
    };
    (routes[view] || routes.inicio)();
  }

  function labelCodeText(value) {
    const code = String(value || '—');
    if (!state.boot || !state.boot.catalogos) return code.replace(/_/g, ' ');
    const types = Object.keys(state.boot.catalogos);
    for (let i = 0; i < types.length; i++) {
      const item = state.boot.catalogos[types[i]].find(function(x) { return x.CODIGO === code; });
      if (item) return item.ETIQUETA || code;
    }
    return code.replace(/_/g, ' ');
  }

  function barChart(title, values) {
    const rows = Object.keys(values || {}).map(function(k) { return [k, values[k]]; }).sort(function(a, b) { return b[1] - a[1]; });
    const max = Math.max.apply(null, [1].concat(rows.map(function(x) { return x[1]; })));
    return `<div class="chart-card"><h2>${escapeHtml(title)}</h2>${rows.length ? rows.map(function(pair) {
      return `<div class="chart-row"><span class="chart-label" title="${escapeHtml(labelCodeText(pair[0]))}">${escapeHtml(labelCodeText(pair[0]))}</span><span class="chart-track"><span class="chart-bar" style="width:${Math.max(3, pair[1] / max * 100)}%"></span></span><strong>${escapeHtml(pair[1])}</strong></div>`;
    }).join('') : '<div class="empty">Sin datos</div>'}</div>`;
  }

  function googleChartsListosV2() {
    return new Promise(function(resolve) {
      if (!(window.google && google.charts)) return resolve(false);
      google.charts.load('current', { packages: ['corechart', 'bar'] });
      google.charts.setOnLoadCallback(function() { resolve(true); });
    });
  }

  function filasGraficoV2(obj) {
    return Object.keys(obj || {}).map(function(k) { return [String(labelCodeText(k)), Number(obj[k] || 0)]; });
  }

  function dibujarDashboardInteractivoV2(d) {
    googleChartsListosV2().then(function(ok) {
      if (!ok) {
        const info = $('#dashboardChartInfo');
        if (info) info.textContent = 'Gráficos estáticos activos (conecte a internet para gráficos dinámicos).';
        return;
      }
      const palette = ['#4f46e5', '#0d9488', '#ea580c', '#059669', '#7c3aed', '#d97706', '#e11d48', '#0284c7', '#6366f1', '#64748b'];
      const base = {
        backgroundColor: 'transparent',
        legend: { position: 'none' },
        chartArea: { left: 58, top: 30, width: '78%', height: '68%' },
        fontName: 'Arial',
        colors: palette,
        tooltip: { isHtml: true }
      };
      const renderG = function(id, tipo, filas, titulo, op) {
        const el = document.getElementById(id);
        if (!el || !filas.length) return;
        const table = google.visualization.arrayToDataTable([['Categoría', 'Cantidad']].concat(filas));
        const chart = tipo === 'pie' ? new google.visualization.PieChart(el) : new google.visualization.ColumnChart(el);
        google.visualization.events.addListener(chart, 'select', function() {
          const s = chart.getSelection()[0];
          if (s && s.row != null) {
            const x = filas[s.row];
            const info = $('#dashboardChartInfo');
            if (info) info.textContent = 'Filtro seleccionado: ' + x[0] + ' (' + x[1] + ' registros).';
          }
        });
        chart.draw(table, Object.assign({}, base, {
          title: titulo,
          height: 300,
          pieHole: tipo === 'pie' ? 0.42 : undefined,
          legend: tipo === 'pie' ? { position: 'right' } : { position: 'none' },
          hAxis: tipo === 'pie' ? undefined : { slantedText: true, slantedTextAngle: 28 },
          vAxis: tipo === 'pie' ? undefined : { minValue: 0, format: '0' }
        }, op || {}));
      };

      renderG('chartRubro', 'bar', filasGraficoV2(d.porRubro), 'Rubros principales', { colors: ['#4f46e5', '#06b6d4', '#10b981'] });
      renderG('chartFormalizacion', 'bar', filasGraficoV2(d.porFormalizacion), 'Nivel de formalización', { colors: ['#0d9488', '#3b82f6', '#8b5cf6'] });
      renderG('chartComunas', 'pie', filasGraficoV2(d.porComuna), 'Comunas de residencia', { colors: palette });
      renderG('chartEdades', 'bar', filasGraficoV2(d.porEdad), 'Distribución por edades', { colors: ['#ea580c', '#f59e0b', '#10b981', '#3b82f6'] });

      const ventas = [['Momento', 'Ventas'], ['Antes', Number((d.evolucionVentas && d.evolucionVentas.antes) || 0)], ['Durante', Number((d.evolucionVentas && d.evolucionVentas.durante) || 0)], ['Después', Number((d.evolucionVentas && d.evolucionVentas.despues) || 0)]];
      const seguidores = [['Momento', 'Seguidores'], ['Antes', Number((d.evolucionSeguidores && d.evolucionSeguidores.antes) || 0)], ['Después', Number((d.evolucionSeguidores && d.evolucionSeguidores.despues) || 0)]];

      const linea = function(id, filas, titulo, color) {
        const el = document.getElementById(id);
        if (!el) return;
        const chart = new google.visualization.LineChart(el);
        chart.draw(google.visualization.arrayToDataTable(filas), Object.assign({}, base, {
          title: titulo,
          height: 300,
          colors: [color || '#4f46e5'],
          legend: { position: 'none' },
          pointSize: 7,
          curveType: 'function',
          vAxis: { minValue: 0, format: '0' }
        }));
      };
      linea('chartVentas', ventas, 'Evolución de ventas ($)', '#059669');
      linea('chartSeguidores', seguidores, 'Evolución de seguidores Instagram', '#7c3aed');
    });
  }

  function validarRutChileno(rutCompleto) {
    if (!rutCompleto) return { valido: false, mensaje: '' };
    const limpio = String(rutCompleto).replace(/[^0-9kK]/g, '').toUpperCase();
    if (limpio.length < 8 || limpio.length > 9) return { valido: false, mensaje: 'RUT incompleto' };
    const cuerpo = limpio.slice(0, -1);
    const dv = limpio.slice(-1);
    let suma = 0, multiplo = 2;
    for (let i = cuerpo.length - 1; i >= 0; i--) {
      suma += Number(cuerpo[i]) * multiplo;
      multiplo = multiplo < 7 ? multiplo + 1 : 2;
    }
    const res = 11 - (suma % 11);
    const dvEsperado = res === 11 ? '0' : res === 10 ? 'K' : String(res);
    const valido = dv === dvEsperado;
    const formatted = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + dv;
    return { valido: valido, formatted: formatted, dvEsperado: dvEsperado, mensaje: valido ? 'RUT válido' : 'Dígito verificador incorrecto' };
  }

        </div>
        <div class="grid">${items.map(function(x) {

        <div id="dashboardChartInfo" class="alert ok">Los gráficos se actualizan con la información vigente del sistema.</div>

      `;

                  <td><button class="btn-link" data-ficha-id="${escapeHtml(r.ID_PERSONA)}">Abrir ficha</button></td>
                </tr>`;

  function bindDocumentosFichaV210(ref) {
    document.querySelectorAll('[data-ficha-open-doc]').forEach(function(b) {
      b.onclick = async function() {
        const w = window.open('about:blank', '_blank');
        try {
          const x = assertOk(await call('apiObtenerUrlDocumento', b.dataset.fichaOpenDoc));
          if (w) w.location = x.url;
        } catch (e) {
          if (w) w.close();
          alertMsg(e.message, 'error');
        }
      };
    });
    document.querySelectorAll('[data-ficha-replace]').forEach(function(b) {
      b.onclick = function() {
        const s = $('#docFichaTipo');
        if (s) {
          s.value = b.dataset.fichaReplace;
          s.scrollIntoView({ behavior: 'smooth', block: 'center' });
          s.focus();
        }
      };
    });
    document.querySelectorAll('[data-ficha-observe]').forEach(function(b) {
      b.onclick = function() { openReviewDialog(b.dataset.fichaObserve, 'FICHA', ref, ''); };
    });
  }

  async function subirDocumentoFichaV210(p, e) {
    const form = $('#docFichaForm'), select = $('#docFichaTipo'), config = DOCUMENTOS_FICHA_V210.find(function(x) { return x.codigo === select.value; });
    const file = form.querySelector('[name="ARCHIVO"]').files[0];
    if (!file) return alertMsg('Seleccione un archivo.', 'error');
    form.querySelector('[name="TIPO_SUJETO"]').value = config.sujeto;
    form.querySelector('[name="ID_SUJETO"]').value = config.sujeto === 'PERSONA' ? p.ID_PERSONA : e.ID_EMPRENDIMIENTO;
    try {
      assertOk(await callForm('apiCargarDocumentoFormulario', form));
      alertMsg('Documento recibido. Ya cuenta para la habilitación automática.');
      renderFichaIntegral(p.ID_PERSONA);
    } catch (err) {
      alertMsg(err.message, 'error');
    }
  }

              <th>Ayuda entregada</th>

              return `<tr>
                <td>${escapeHtml(dateTimeLabel(s.FECHA_REGISTRO))}</td>
                <td><span class="badge-help">🤝 ${escapeHtml(labelCodeText(s.TIPO_AYUDA || 'PUNTO_DE_VENTA'))}</span></td>

                <td>${escapeHtml(s.SEGUIDORES_ANTES || 0)} → ${escapeHtml(s.SEGUIDORES_DESPUES || 0)}<strong>${diffLabel}</strong></td>
                <td>${escapeHtml(labelCodeText(s.PUNTUALIDAD))}</td>
                <td>${escapeHtml(labelCodeText(s.RESPONSABILIDAD))}</td>
              </tr>`;
            }).join('')}

        </table>

    const hist = d.historial.length ? `

        b.onclick = function() { renderPostulacionDetalle(b.dataset.fichaPost); };

    return seg + hist;

    let dupTimer = null;

    if (rutInput) {
      rutInput.oninput = function() {
        const val = rutInput.value.trim();
        const res = validarRutChileno(val);
        if (res.valido) {
          badgeEl.innerHTML = `<span class="rut-badge valid">✓ RUT válido (${res.formatted})</span>`;
        } else if (val.length >= 8) {
          badgeEl.innerHTML = `<span class="rut-badge invalid">✗ ${res.mensaje}</span>`;
        } else {
          badgeEl.innerHTML = '';
        }

        clearTimeout(dupTimer);
        dupEl.innerHTML = '';
        if (val.length >= 7) {
          dupTimer = setTimeout(async function() {
            try {
              const matches = assertOk(await call('apiBuscarPersonas', val));
              const exact = matches.find(function(p) {
                return (p.RUT_NORMALIZADO && p.RUT_NORMALIZADO.replace(/[^0-9K]/gi, '') === val.replace(/[^0-9K]/gi, ''));

              }
            } catch (ignored) {}
          }, 350);
        }
      };
    }

    $('#saveComplete').onclick = saveRegistroCompleto;
  }

  function pagination(data) {
    if (data.total <= data.limit) return '';
    const prev = Math.max(0, data.offset - data.limit), next = data.offset + data.limit;
    return `
      <div class="pagination">
        <button class="btn btn-secondary" data-page-offset="${prev}" ${data.offset === 0 ? 'disabled' : ''}>Anterior</button>
        <span>${data.offset + 1}–${Math.min(next, data.total)} de ${data.total}</span>
        <button class="btn btn-secondary" data-page-offset="${next}" ${next >= data.total ? 'disabled' : ''}>Siguiente</button>
      </div>
    `;
  }

  async function buscarSujetosDocumento() {
    const q = $('#docSubjectQ').value.trim(), target = $('#docSubjectResults');

      target.innerHTML = '<div class="alert error">Ingrese al menos dos caracteres.</div>';
      return;
    }
    target.innerHTML = '<div class="empty">Buscando…</div>';
    try {
      const results = await Promise.all([call('apiBuscarPersonas', q), call('apiBuscarEmprendimientos', q)]);
      const personas = assertOk(results[0]), emps = assertOk(results[1]);
      target.innerHTML = `
        <div class="master-results">
          <section>
            <div class="panel-head"><h2>Personas</h2><span class="counter">${personas.length}</span></div>
            ${personas.length ? personas.map(function(p) {
              return `<div class="relation-row"><div><strong>${escapeHtml([p.NOMBRES, p.APELLIDO_PATERNO].filter(Boolean).join(' '))}</strong><small>${escapeHtml(p.RUT_NORMALIZADO || p.EMAIL_NORMALIZADO || 'Sin identificación')}</small></div><button class="btn-link" data-doc-person="${escapeHtml(p.ID_PERSONA)}" data-doc-label="${escapeHtml([p.NOMBRES, p.APELLIDO_PATERNO].filter(Boolean).join(' '))}">Abrir expediente</button></div>`;

        </div>

  async function uploadDocument(tipo, id, label) {
    const form = $('#docUploadForm'), button = $('#uploadDoc'), file = form.querySelector('[name="ARCHIVO"]').files[0];
    if (!file) return alertMsg('Seleccione un archivo.', 'error');
    if (file.size > 10 * 1024 * 1024) return alertMsg('El archivo supera 10 MB.', 'error');
    try {
      button.disabled = true;
      button.textContent = 'Cargando…';
      assertOk(await callForm('apiCargarDocumentoFormulario', form));
      alertMsg('Documento cargado correctamente.');
      renderExpediente(tipo, id, label);
    } catch (e) {
      alertMsg(e.message, 'error');
      button.disabled = false;
      button.textContent = 'Cargar documento';
    }

  function bindDocumentActions(tipo, id, label) {
    document.querySelectorAll('[data-open-doc]').forEach(function(b) {
      b.onclick = async function() {
        const win = window.open('about:blank', '_blank');
        try {
          const data = assertOk(await call('apiObtenerUrlDocumento', b.dataset.openDoc));
          if (win) win.location = data.url;
          else window.location.href = data.url;

          if (win) win.close();
          alertMsg(e.message, 'error');

      };

      b.onclick = function() { openReviewDialog(b.dataset.reviewDoc, tipo, id, label); };

  function openReviewDialog(docId, tipo, id, label) {
    const estados = [
      ['RECIBIDO', 'Recibido / sin observaciones'],
      ['VIGENTE', 'Validado voluntariamente'],
      ['OBSERVADO', 'Observado: requiere corrección'],
      ['RECHAZADO', 'Rechazado']

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-card">
        <h2>Revisar una excepción</h2>

        <div class="field">
          <label>Estado</label>
          <select id="reviewState">${estados.map(function(i) { return `<option value="${i[0]}">${i[1]}</option>`; }).join('')}</select>
        </div>
        <div class="field">
          <label>Observación o motivo</label>
          <textarea id="reviewReason"></textarea>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="reviewConfirm">Guardar</button>
          <button class="btn btn-secondary" id="reviewCancel">Cancelar</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector('#reviewCancel').onclick = function() { overlay.remove(); };
    overlay.querySelector('#reviewConfirm').onclick = async function() {
      try {
        assertOk(await call('apiRevisarDocumento', docId, overlay.querySelector('#reviewState').value, overlay.querySelector('#reviewReason').value));
        overlay.remove();
        alertMsg('Estado documental actualizado.');
        tipo === 'FICHA' ? renderFichaIntegral(id) : renderExpediente(tipo, id, label);
      } catch (e) {
        alertMsg(e.message, 'error');
      }
    };
  }

      $('#newInitiativeState').value = i.ESTADO || 'BORRADOR';

      $('#bulkApplications').onclick = function() { renderPostulacionMasiva(id); };

        if (!confirm('Se volverá a evaluar cada postulación activa. ¿Continuar?')) return;
        try {
          const r = assertOk(await call('apiEvaluarAdmisibilidadMasiva', id));
          alertMsg(`Evaluación terminada: ${r.admisibles} admisibles, ${r.subsanables} subsanables y ${r.inadmisibles} inadmisibles.`);
          renderIniciativaDetalle(id);
        } catch (e) {
          alertMsg(e.message, 'error');
        }
      };
      $('#addRequirement').onclick = function() { saveRequirement(id); };
      document.querySelector('[name="CAMPO"]').onchange = updateRuleValueSuggestions;
      updateRuleValueSuggestions();
      $('#changeInitiativeState').onclick = async function() {
        try {
          const newState = $('#newInitiativeState').value;
          const r = assertOk(await call('apiCambiarEstadoIniciativa', id, newState, 'Cambio a ' + newState));
          alertMsg(r.advertencia || 'Estado de la iniciativa actualizado con éxito.');
          renderIniciativaDetalle(id);
        } catch (e) {
          alertMsg(e.message, 'error');

        renderMercadoExtension(id);
      }
    } catch (e) {
      renderInfo('Gestión de iniciativa', e.message);
    }

    $('#marketFolder').onclick = async function() {

      } catch (e) {
        alertMsg(e.message, 'error');
      }
    };

      try {

        alertMsg(e.message, 'error');

    $('#marketForm').onclick = async function() {

        alertMsg(e.message, 'error');
      }

    $('#marketRecreate').onclick = async function() {

      try {
        const r = assertOk(await call('apiRecrearFormularioPostulacionMercadoV203', id));

      } catch (e) {
        alertMsg(e.message, 'error');
      }
    };
    $('#marketDocUpload').onclick = async function() {
      const f = $('#marketDocForm');
      if (!f.archivo.files[0]) return alertMsg('Seleccione un archivo.', 'error');
      try {
        assertOk(await callForm('apiCargarDocumentoMercado', f));
        alertMsg('Documento del mercado cargado.');
        renderIniciativaDetalle(id);
      } catch (e) {
        alertMsg(e.message, 'error');
      }

      const docs = assertOk(await call('apiListarDocumentosMercado', id));
      $('#marketDocRows').innerHTML = docs.length ? `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Documento</th>
                <th>Archivo</th>
                <th>Fecha</th>
                <th></th>
              </tr>
            </thead>

              ${docs.map(function(d) {

                  <td>${escapeHtml(labelCodeText(d.TIPO_DOCUMENTO))}</td>
                  <td>${escapeHtml(d.NOMBRE_ARCHIVO)}</td>
                  <td>${escapeHtml(dateTimeLabel(d.CREADO_EN))}</td>

                </tr>`;

            </tbody>

        b.onclick = async function() {
          try {
            const r = assertOk(await call('apiObtenerUrlDocumentoMercado', b.dataset.marketDoc));
            window.open(r.url, '_blank');
          } catch (e) {
            alertMsg(e.message, 'error');
          }
        };
      });
    } catch (e) {
      console.warn(e);
    }

  function updateRuleValueSuggestions() {
    const field = document.querySelector('[name="CAMPO"]'), list = $('#ruleValueOptions');
    if (!field || !list) return;
    const map = {
      ID_RUBRO: 'RUBRO',
      ID_SUBRUBRO: 'SUBRUBRO',
      FORMALIZACION: 'FORMALIZACION',
      ETAPA_ACTUAL: 'ETAPA_EMPRENDIMIENTO',
      ESTADO_EMPRENDIMIENTO: 'ESTADO_EMPRENDIMIENTO'
    };
    let values = map[field.value] ? catalogItems(map[field.value]).map(function(x) { return x.CODIGO; }) : ['SI', 'NO'];
    if (field.value === 'GENERO_PERSONA') values = ['MUJER', 'HOMBRE', 'NO_BINARIO', 'OTRO', 'PREFIERE_NO_INFORMAR'];
    if (['TERRITORIO_OPERACION', 'COMUNA_PERSONA'].indexOf(field.value) >= 0) values = [];
    list.innerHTML = values.map(function(v) { return `<option value="${escapeHtml(v)}"></option>`; }).join('');
  }

  function bindRequirementActions(initiativeId) {
    document.querySelectorAll('[data-disable-rule]').forEach(function(b) {
      b.onclick = function() {
        requestReason('Desactivar requisito', 'La regla se conservará en el historial.', async function(motivo) {
          try {
            assertOk(await call('apiDesactivarRequisito', b.dataset.disableRule, motivo));
            alertMsg('Requisito desactivado.');
            renderIniciativaDetalle(initiativeId);
          } catch (e) {
            alertMsg(e.message, 'error');
          }
        });
      };
    });
  }

  async function saveRequirement(initiativeId) {
    try {
      const data = {
        ID_INICIATIVA: initiativeId,
        TIPO_REGLA: document.querySelector('[name="TIPO_REGLA"]').value,
        CAMPO: document.querySelector('[name="CAMPO"]').value,
        OPERADOR: document.querySelector('[name="OPERADOR"]').value,
        VALOR_ESPERADO: document.querySelector('[name="VALOR_ESPERADO"]').value,
        ORDEN: document.querySelector('[name="ORDEN"]').value,
        ES_SUBSANABLE: $('#ruleFixable').checked ? 'SI' : 'NO'
      };
      assertOk(await call('apiAgregarRequisito', data));
      alertMsg('Requisito agregado.');
      renderIniciativaDetalle(initiativeId);
    } catch (e) {
      alertMsg(e.message, 'error');
    }
  }

    });
  }

  function renderNuevaPostulacion(initiativeId) {
    setActive('postulaciones', 'Nueva postulación');
    $('#view').innerHTML = `
      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>Seleccionar emprendimiento</h2>
            <p class="muted">Busca antes de crear para evitar postulaciones duplicadas.</p>
          </div>
          <button class="btn btn-secondary" id="backInitiative">Volver</button>
        </div>
        <div class="search-row">
          <input id="applicationEmpQ" placeholder="Nombre, rubro, producto o territorio">

        </div>
        <div id="applicationEmpResults" class="empty">Ingrese al menos dos caracteres.</div>
      </div>
    `;
    $('#backInitiative').onclick = function() { renderIniciativaDetalle(initiativeId); };
    $('#applicationEmpSearch').onclick = function() { buscarEmpPostulacion(initiativeId); };

  function renderPostulacionMasiva(initiativeId) {
    setActive('postulaciones', 'Incorporar postulaciones');
    $('#view').innerHTML = `
      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>Incorporar varios emprendimientos</h2>
            <p class="muted">Seleccione fichas ya registradas.</p>
          </div>
          <button class="btn btn-secondary" id="backBulk">Volver</button>
        </div>
        <div class="search-row">
          <input id="bulkQ" placeholder="Buscar por nombre, código, rubro o territorio">
          <button class="btn btn-secondary" id="bulkSearch">Buscar</button>
        </div>
        <div id="bulkResults" class="empty">Cargando emprendimientos…</div>
        <div class="actions">
          <label class="check-box"><input type="checkbox" id="bulkEvaluate" checked> Evaluar admisibilidad inmediatamente</label>
          <button class="btn btn-primary" id="bulkCreate">Incorporar seleccionados</button>
        </div>

    $('#backBulk').onclick = function() { renderIniciativaDetalle(initiativeId); };

    $('#bulkCreate').onclick = function() { createBulkApplications(initiativeId); };

  async function loadBulkCandidates(initiativeId) {
    const target = $('#bulkResults');
    try {
      const rows = assertOk(await call('apiListarCandidatosIniciativa', initiativeId, $('#bulkQ').value));
      target.innerHTML = rows.length ? `
        <div class="bulk-list">
          ${rows.map(function(r) {
            return `
              <label class="bulk-item">
                <input type="checkbox" class="bulk-check" data-emp="${escapeHtml(r.ID_EMPRENDIMIENTO)}" data-contact="${escapeHtml(r.ID_PERSONA_CONTACTO || '')}" ${r.YA_POSTULADO === 'SI' ? 'disabled' : ''}>
                <span>
                  <strong>${escapeHtml(r.NOMBRE_COMERCIAL)}</strong>
                  <small>${escapeHtml(r.CODIGO_EMPRENDIMIENTO || '')} · ${escapeHtml(labelCodeText(r.ID_RUBRO))} · ${escapeHtml(r.NOMBRE_CONTACTO || 'Sin titular')}</small>
                </span>
                ${r.YA_POSTULADO === 'SI' ? '<span class="tag">Ya incorporado</span>' : '<span class="tag">Disponible</span>'}
              </label>
            `;
          }).join('')}
        </div>
      ` : '<div class="empty">No se encontraron emprendimientos.</div>';
    } catch (e) {
      target.innerHTML = `<div class="alert error">${escapeHtml(e.message)}</div>`;
    }
  }

  async function createBulkApplications(initiativeId) {
    const selected = Array.from(document.querySelectorAll('.bulk-check:checked')).map(function(x) {
      return { ID_EMPRENDIMIENTO: x.dataset.emp, ID_PERSONA_CONTACTO: x.dataset.contact };
    });
    if (!selected.length) return alertMsg('Seleccione al menos un emprendimiento.', 'error');
    try {
      const r = assertOk(await call('apiCrearPostulacionesMasivas', initiativeId, selected, $('#bulkEvaluate').checked));
      alertMsg(`Proceso terminado: ${r.creadas} creadas, ${r.duplicadas} duplicadas.`);
      renderIniciativaDetalle(initiativeId);
    } catch (e) {
      alertMsg(e.message, 'error');
    }
  }

  async function buscarEmpPostulacion(initiativeId) {
    const q = $('#applicationEmpQ').value.trim(), target = $('#applicationEmpResults');
    if (q.length < 2) {
      target.innerHTML = '<div class="alert error">Ingrese al menos dos caracteres.</div>';
      return;
    }
    target.innerHTML = '<div class="empty">Buscando…</div>';
    try {
      const rows = assertOk(await call('apiBuscarEmprendimientos', q));
      target.innerHTML = rows.length ? rows.map(function(e) {
        return `<div class="relation-row"><div><strong>${escapeHtml(e.NOMBRE_COMERCIAL)}</strong><small>${labelCodeText(e.ID_RUBRO)} · ${escapeHtml(e.TERRITORIO_OPERACION || 'Sin territorio')}</small></div><button class="btn btn-primary btn-small" data-choose-emp="${escapeHtml(e.ID_EMPRENDIMIENTO)}">Seleccionar</button></div>`;
      }).join('') : '<div class="empty">No se encontraron emprendimientos.</div>';
      target.querySelectorAll('[data-choose-emp]').forEach(function(b) {
        b.onclick = function() { openApplicationDialog(initiativeId, b.dataset.chooseEmp); };
      });
    } catch (e) {
      target.innerHTML = `<div class="alert error">${escapeHtml(e.message)}</div>`;
    }
  }

  async function openApplicationDialog(initiativeId, empId) {
    try {
      const data = assertOk(await call('apiObtenerEmprendimiento', empId));
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-card">
          <h2>Nueva postulación</h2>
          <p class="muted">${escapeHtml(data.emprendimiento.NOMBRE_COMERCIAL)}</p>
          <div class="field">
            <label>Persona de contacto</label>
            <select id="applicationContact">
              <option value="">Sin contacto definido</option>
              ${data.representantes.map(function(r) {
                const p = r.PERSONA || {};
                return `<option value="${escapeHtml(r.ID_PERSONA)}" ${r.ES_PRINCIPAL === 'SI' ? 'selected' : ''}>${escapeHtml([p.NOMBRES, p.APELLIDO_PATERNO].filter(Boolean).join(' '))}</option>`;
              }).join('')}
            </select>
          </div>
          <div class="field">
            <label>Observaciones</label>
            <textarea id="applicationNotes"></textarea>
          </div>
          <div class="actions">
            <button class="btn btn-primary" id="applicationConfirm">Crear postulación</button>
            <button class="btn btn-secondary" id="applicationCancel">Cancelar</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      overlay.querySelector('#applicationCancel').onclick = function() { overlay.remove(); };
      overlay.querySelector('#applicationConfirm').onclick = async function() {
        try {
          const saved = assertOk(await call('apiCrearPostulacion', {
            ID_INICIATIVA: initiativeId,
            ID_EMPRENDIMIENTO: empId,
            ID_PERSONA_CONTACTO: overlay.querySelector('#applicationContact').value,
            RESPUESTAS: { OBSERVACIONES: overlay.querySelector('#applicationNotes').value }
          }));
          overlay.remove();
          alertMsg('Postulación creada.');
          renderPostulacionDetalle(saved.ID_POSTULACION);
        } catch (e) {
          alertMsg(e.message, 'error');
        }
      };
    } catch (e) {
      alertMsg(e.message, 'error');
    }
  }

  function renderPostulaciones() {
    setActive('postulaciones', 'Postulaciones');
    $('#view').innerHTML = `
      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>Registro de postulaciones</h2>
            <p class="muted">Consulta el avance de admisibilidad de todas las iniciativas.</p>
          </div>
        </div>
        <div class="filters">
          <input id="applicationQ" placeholder="Buscar iniciativa, emprendimiento o contacto">
          <select id="applicationState">
            <option value="">Todos los estados</option>
            ${catalogItems('ESTADO_POSTULACION').map(function(i) { return `<option value="${escapeHtml(i.CODIGO)}">${escapeHtml(i.ETIQUETA)}</option>`; }).join('')}
          </select>
          <button class="btn btn-secondary" id="applicationSearch">Buscar</button>
        </div>
        <div id="applicationResults" class="empty">Cargando…</div>
      </div>
    `;
    $('#applicationSearch').onclick = function() { loadPostulaciones(0); };
    $('#applicationQ').onkeydown = function(e) { if (e.key === 'Enter') loadPostulaciones(0); };
    $('#applicationState').onchange = function() { loadPostulaciones(0); };
    loadPostulaciones(0);
  }

  async function loadPostulaciones(offset) {
    const target = $('#applicationResults');
    target.innerHTML = '<div class="empty">Cargando…</div>';
    try {
      const data = assertOk(await call('apiListarPostulaciones', {
        q: $('#applicationQ').value,
        estado: $('#applicationState').value,
        offset: offset,
        limit: 25
      }));
      target.innerHTML = data.filas.length ? `${renderApplicationRows(data.filas)}${pagination(data)}` : '<div class="empty">No se encontraron postulaciones.</div>';
      bindApplicationLinks();
      target.querySelectorAll('[data-page-offset]').forEach(function(b) {
        b.onclick = function() { loadPostulaciones(Number(b.dataset.pageOffset)); };
      });
    } catch (e) {
      target.innerHTML = `<div class="alert error">${escapeHtml(e.message)}</div>`;
    }
  }

  async function renderPostulacionDetalle(id) {

        const checked = document.querySelectorAll('.v2Check:checked').length;
        const tit = Math.max(0, Number($('#v2Tit').value || 0));

        const titCount = Math.min(checked, tit);
        const supCount = Math.min(Math.max(0, checked - tit), sup);
        const noSelCount = Math.max(0, checked - tit - sup);
        let text = `<strong>${checked} seleccionados</strong>: ${titCount} titulares, ${supCount} suplentes`;
        if (noSelCount > 0) text += `, ${noSelCount} sin cupo`;
        $('#v2SelectionCounter').innerHTML = text;

        updateCounter();

      $('#v2SelectAll').onclick = function() {
        document.querySelectorAll('.v2Check').forEach(function(c) { c.checked = true; });
        updateCounter();
      };

      $('#v2ClearSelection').onclick = function() {
        document.querySelectorAll('.v2Check').forEach(function(c) { c.checked = false; });
        updateCounter();
      };

      refresh();
    } catch (e) {
      renderInfo('Selección manual', e.message);
    }
  }

  async function saveSelectionV2() {

    try {

        CUPOS_TITULARES: $('#v2Tit').value,
        CUPOS_SUPLENTES: $('#v2Sup').value,
        CRITERIOS: crit,
        FILTROS: { q: $('#v2Q').value, rubro: $('#v2Rubro').value, formalizacion: $('#v2Formal').value, orden: $('#v2Sort').value }

      alertMsg(e.message, 'error');

          alertMsg(e ? `${e.split(';').length} correos copiados para CCO.` : 'No hay confirmados con correo.');

  function downloadConfirmados(rows) {
    const data = rows.filter(function(r) { return r.ESTADO_SEGUIMIENTO === 'CONFIRMADA'; }).map(function(r) {
      return [r.NOMBRE_EMPRENDIMIENTO, r.NOMBRE_CONTACTO, r.CORREO, r.TELEFONO];
    });
    const csv = ['Emprendimiento,Contacto,Correo,Teléfono'].concat(data.map(function(x) {
      return x.map(function(v) { return '"' + String(v || '').replace(/"/g, '""') + '"'; }).join(',');
    })).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'nomina_confirmados.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  }

          </table>
        </div>
      ` : '<div class="empty">No hay emprendedores confirmados o asistentes en este mercado aún.</div>';

      document.querySelectorAll('.v2Track').forEach(function(b) {
        b.onclick = function() {
          const last = seg.find(function(x) { return String(x.ID_POSTULACION) === String(b.dataset.p); });
          openTrackingModal(id, b.dataset.p, b.dataset.e, b.dataset.name, b.dataset.contact, last);
        };
      });
      document.querySelectorAll('.v2TrackFicha').forEach(function(b) {
        b.onclick = function() { renderFichaIntegral(b.dataset.persona); };
      });
    } catch (e) {
      t.innerHTML = `<div class="alert error">${escapeHtml(e.message)}</div>`;
    }
  }

  function openTrackingModal(marketId, postId, empId, empName, contactName, current) {
    current = current || {};
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="metric-modal-card">
        <div class="metric-modal-header">
          <h2 style="margin:0 0 4px; color:var(--navy);">📊 Registro de Métricas y Apoyos</h2>
          <p class="muted" style="margin:0;">${escapeHtml(empName)} · Titular: ${escapeHtml(contactName || '—')}</p>
        </div>
        <form id="trackModalForm">
          <div class="field" style="margin-bottom:14px;">
            <label>🤝 Tipo de Ayuda / Apoyo Municipal Entregado *</label>
            <select name="TIPO_AYUDA" id="tmAyuda" style="font-weight:600;">
              <option value="PUNTO_DE_VENTA" ${current.TIPO_AYUDA === 'PUNTO_DE_VENTA' || !current.TIPO_AYUDA ? 'selected' : ''}>Punto de venta (puesto en feria/mercado)</option>
              <option value="ASESORIA" ${current.TIPO_AYUDA === 'ASESORIA' ? 'selected' : ''}>Asesoría / Capacitación / Acompañamiento</option>
              <option value="PUNTO_DE_VENTA_Y_ASESORIA" ${current.TIPO_AYUDA === 'PUNTO_DE_VENTA_Y_ASESORIA' ? 'selected' : ''}>Punto de venta y Asesoría</option>
              <option value="OTRO" ${current.TIPO_AYUDA === 'OTRO' ? 'selected' : ''}>Otro apoyo municipal</option>
            </select>
          </div>

          <div class="help-box" style="margin:8px 0 12px;"><strong>💰 Ventas generadas ($ CLP)</strong></div>
          <div class="form-grid">
            <div class="field">
              <label>Ventas antes del evento ($)</label>
              <input type="number" min="0" step="100" name="VENTAS_ANTES" id="tmVentasAntes" value="${current.VENTAS_ANTES || 0}">
            </div>
            <div class="field">
              <label><strong>Ventas durante el evento ($) *</strong></label>
              <input type="number" min="0" step="100" name="VENTAS_DURANTE" id="tmVentasDurante" value="${current.VENTAS_DURANTE || 0}" style="font-weight:700; border-color:var(--emerald);">
            </div>
            <div class="field">
              <label>Ventas después del evento ($)</label>
              <input type="number" min="0" step="100" name="VENTAS_DESPUES" id="tmVentasDespues" value="${current.VENTAS_DESPUES || 0}">
            </div>
          </div>

          <div class="help-box" style="margin:14px 0 12px;"><strong>📸 Comunidad en Instagram</strong></div>
          <div class="form-grid">
            <div class="field">
              <label>Seguidores antes del evento</label>
              <input type="number" min="0" name="SEGUIDORES_ANTES" id="tmSegAntes" value="${current.SEGUIDORES_ANTES || 0}">
            </div>
            <div class="field">
              <label>Seguidores después del evento</label>
              <input type="number" min="0" name="SEGUIDORES_DESPUES" id="tmSegDespues" value="${current.SEGUIDORES_DESPUES || 0}">
            </div>
            <div class="field">
              <label>Crecimiento calculado</label>
              <div id="tmSegCalc" class="follower-calc-badge follower-calc-neutral">0 seguidores</div>
            </div>
          </div>

          <div class="help-box" style="margin:14px 0 12px;"><strong>⭐ Desempeño y Evaluación</strong></div>
          <div class="form-grid">
            <div class="field">
              <label>Puntualidad</label>
              <select name="PUNTUALIDAD">
                <option value="A_TIEMPO" ${current.PUNTUALIDAD === 'A_TIEMPO' || !current.PUNTUALIDAD ? 'selected' : ''}>A tiempo</option>
                <option value="TARDE" ${current.PUNTUALIDAD === 'TARDE' ? 'selected' : ''}>Tarde</option>
                <option value="SIN_REGISTRO" ${current.PUNTUALIDAD === 'SIN_REGISTRO' ? 'selected' : ''}>Sin registro</option>
              </select>
            </div>
            <div class="field">
              <label>Responsabilidad</label>
              <select name="RESPONSABILIDAD">
                <option value="DESTACADA" ${current.RESPONSABILIDAD === 'DESTACADA' ? 'selected' : ''}>Destacada</option>
                <option value="ADECUADA" ${current.RESPONSABILIDAD === 'ADECUADA' || !current.RESPONSABILIDAD ? 'selected' : ''}>Adecuada</option>
                <option value="OBSERVADA" ${current.RESPONSABILIDAD === 'OBSERVADA' ? 'selected' : ''}>Observada</option>
              </select>
            </div>
            <div class="field">
              <label>Evaluación funcionario</label>
              <select name="EVALUACION_FUNCIONARIO">
                <option value="DESTACADO" ${current.EVALUACION_FUNCIONARIO === 'DESTACADO' ? 'selected' : ''}>Destacado</option>
                <option value="ADECUADO" ${current.EVALUACION_FUNCIONARIO === 'ADECUADO' || !current.EVALUACION_FUNCIONARIO ? 'selected' : ''}>Adecuado</option>
                <option value="REQUIERE_APOYO" ${current.EVALUACION_FUNCIONARIO === 'REQUIERE_APOYO' ? 'selected' : ''}>Requiere apoyo</option>
                <option value="NO_EVALUADO" ${current.EVALUACION_FUNCIONARIO === 'NO_EVALUADO' ? 'selected' : ''}>No evaluado</option>
              </select>
            </div>
            <div class="field field-wide">
              <label>Observaciones del funcionario</label>
              <textarea name="OBSERVACION" rows="2">${escapeHtml(current.OBSERVACION || '')}</textarea>
            </div>
          </div>

          <div class="actions" style="margin-top:20px;">
            <button type="button" class="btn btn-primary" id="tmSaveBtn">💾 Guardar métricas</button>
            <button type="button" class="btn btn-secondary" id="tmCancelBtn">Cancelar</button>
          </div>
        </form>
      </div>
    `;

    document.body.appendChild(overlay);

    const calcSeg = function() {
      const a = Number(overlay.querySelector('#tmSegAntes').value || 0);
      const d = Number(overlay.querySelector('#tmSegDespues').value || 0);
      const diff = d - a;
      const el = overlay.querySelector('#tmSegCalc');
      if (diff > 0) {
        el.className = 'follower-calc-badge follower-calc-positive';
        el.textContent = `+${diff} seguidores ganados 🎉`;
      } else if (diff < 0) {
        el.className = 'follower-calc-badge follower-calc-neutral';
        el.textContent = `${diff} seguidores`;
      } else {
        el.className = 'follower-calc-badge follower-calc-neutral';
        el.textContent = 'Sin variación';
      }
    };
    overlay.querySelector('#tmSegAntes').oninput = calcSeg;
    overlay.querySelector('#tmSegDespues').oninput = calcSeg;
    calcSeg();

    overlay.querySelector('#tmCancelBtn').onclick = function() { overlay.remove(); };
    overlay.querySelector('#tmSaveBtn').onclick = async function() {
      const b = overlay.querySelector('#tmSaveBtn');
      const f = overlay.querySelector('#trackModalForm');
      const payload = {
        ID_INICIATIVA: marketId,
        ID_POSTULACION: postId,
        ID_EMPRENDIMIENTO: empId,
        TIPO_AYUDA: f.querySelector('[name="TIPO_AYUDA"]').value,
        VENTAS_ANTES: Number(f.querySelector('[name="VENTAS_ANTES"]').value || 0),
        VENTAS_DURANTE: Number(f.querySelector('[name="VENTAS_DURANTE"]').value || 0),
        VENTAS_DESPUES: Number(f.querySelector('[name="VENTAS_DESPUES"]').value || 0),
        SEGUIDORES_ANTES: Number(f.querySelector('[name="SEGUIDORES_ANTES"]').value || 0),
        SEGUIDORES_DESPUES: Number(f.querySelector('[name="SEGUIDORES_DESPUES"]').value || 0),
        PUNTUALIDAD: f.querySelector('[name="PUNTUALIDAD"]').value,
        RESPONSABILIDAD: f.querySelector('[name="RESPONSABILIDAD"]').value,
        EVALUACION_FUNCIONARIO: f.querySelector('[name="EVALUACION_FUNCIONARIO"]').value,
        OBSERVACION: f.querySelector('[name="OBSERVACION"]').value
      };
      try {
        if (b) { b.disabled = true; b.textContent = 'Guardando métricas…'; }
        assertOk(await call('apiRegistrarSeguimientoMercado', payload));
        overlay.remove();
        alertMsg('Métricas guardadas exitosamente.');
        loadTrackingV2();
      } catch (err) {
        alertMsg(err.message, 'error');
        if (b) { b.disabled = false; b.textContent = '💾 Guardar métricas'; }
      }
    };
  }

  async function renderComunicacionesV2() {
    setActive('comunicaciones', 'Comunicaciones');
    $('#view').innerHTML = '<div class="panel empty">Cargando opciones…</div>';
    try {
      const ms = await mercadosOpcionesV2();
      $('#view').innerHTML = `
        <div class="panel">
          <h2>Preparar comunicaciones</h2>
          <p class="muted">Obtenga correos para CCO o descargue una nómina.</p>
          <div class="form-grid">
            <div class="field">
              <label>Destinatarios</label>
              <select id="commType">
                <option value="BASE">Toda la base activa</option>
                <option value="MERCADO_SELECCIONADOS">Seleccionados de un mercado</option>
                <option value="MERCADO_CONFIRMADOS">Confirmados de un mercado</option>
              </select>
            </div>
            <div class="field">
              <label>Mercado</label>
              <select id="commMarket">
                <option value="">No aplica</option>
                ${ms.map(function(i) { return `<option value="${i.ID_INICIATIVA}">${escapeHtml(i.NOMBRE)}</option>`; }).join('')}
              </select>
            </div>
            <div class="field">
              <label>Asunto de referencia</label>
              <input id="commSubject" placeholder="Ej.: Información importante del mercado">
            </div>
          </div>
          <div class="actions">
            <button class="btn btn-primary" id="commPrepare">Preparar destinatarios</button>
          </div>
          <div id="commRows"></div>
        </div>
      `;
      $('#commPrepare').onclick = prepareCommsV2;
    } catch (e) {
      renderInfo('Comunicaciones', e.message);
    }
  }

  async function prepareCommsV2() {
    try {
      const cfg = {
        TIPO_DESTINATARIO: $('#commType').value,
        ID_INICIATIVA: $('#commMarket').value,
        ASUNTO_REFERENCIA: $('#commSubject').value,
        FILTROS: {}
      };
      const r = assertOk(await call('apiRegistrarComunicacion', cfg));
      const rows = r.destinatarios;
      const emails = rows.map(function(x) { return x.EMAIL; }).join('; ');
      $('#commRows').innerHTML = `
        <div class="alert ok">${rows.length} destinatarios preparados y registrados en auditoría.</div>
        <div class="actions">
          <button class="btn btn-secondary" id="commCopy">Copiar correos CCO</button>
          <button class="btn btn-secondary" id="commCsv">Descargar CSV</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Comuna</th></tr></thead>
            <tbody>
              ${rows.map(function(x) {
                return `<tr><td>${escapeHtml(x.NOMBRE)}</td><td>${escapeHtml(x.EMAIL)}</td><td>${escapeHtml(x.TELEFONO)}</td><td>${escapeHtml(x.COMUNA)}</td></tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
      $('#commCopy').onclick = async function() {
        try {
          await navigator.clipboard.writeText(emails);
          alertMsg('Correos copiados para CCO.');
        } catch (e) {
          alertMsg('No se pudo copiar; use la descarga CSV.', 'error');
        }
      };
      $('#commCsv').onclick = function() {
        const csv = ['Nombre,Correo,Teléfono,Comuna'].concat(rows.map(function(x) {
          return [x.NOMBRE, x.EMAIL, x.TELEFONO, x.COMUNA].map(function(v) {
            return '"' + String(v || '').replace(/"/g, '""') + '"';
          }).join(',');
        })).join('\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        a.download = 'destinatarios_sge.csv';
        a.click();
        URL.revokeObjectURL(a.href);
      };
    } catch (e) {
      alertMsg(e.message, 'error');
    }
  }

  async function renderAuditoria() {
    setActive('auditoria', 'Auditoría');
    $('#view').innerHTML = `
      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>Historial de acciones</h2>
            <p class="muted">Consulte quién realizó cada acción y sobre qué registro.</p>
          </div>
        </div>
        <div class="filters">
          <input id="auditQ" placeholder="Buscar por usuario, acción, sección, registro o motivo">
          <select id="auditSection">
            <option value="">Todas las secciones</option>
            <option>PERSONAS</option>
            <option>EMPRENDIMIENTOS</option>
            <option>DOCUMENTOS</option>
            <option>INICIATIVAS</option>
            <option>POSTULACIONES</option>
            <option>ADMISIONES</option>
            <option>PROCESOS SELECCION</option>
          </select>
          <button class="btn btn-secondary" id="auditSearch">Buscar</button>
        </div>
        <div id="auditRows" class="empty">Cargando historial…</div>
      </div>
    `;
    $('#auditSearch').onclick = loadAudit;
    $('#auditQ').onkeydown = function(e) { if (e.key === 'Enter') loadAudit(); };
    loadAudit();
  }

  async function loadAudit() {
    const target = $('#auditRows');
    try {
      const rows = assertOk(await call('apiAuditoriaLegible', {
        q: $('#auditQ').value,
        seccion: $('#auditSection').value
      }));
      target.innerHTML = rows.length ? `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Usuario</th>
                <th>Acción</th>
                <th>Sección</th>
                <th>Registro</th>
                <th>Motivo</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(function(r, i) {
                return `<tr>
                  <td>${escapeHtml(dateTimeLabel(r.FECHA))}</td>
                  <td>${escapeHtml(r.USUARIO)}</td>
                  <td>${escapeHtml(r.ACCION)}</td>
                  <td>${escapeHtml(r.SECCION)}</td>
                  <td>${escapeHtml(r.REGISTRO)}</td>
                  <td>${escapeHtml(r.MOTIVO)}</td>
                  <td><button class="btn-link" data-audit-detail="${i}">Detalle</button></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      ` : '<div class="empty">No se encontraron eventos.</div>';
      target.querySelectorAll('[data-audit-detail]').forEach(function(b) {
        b.onclick = function() { showAuditDetail(rows[Number(b.dataset.auditDetail)]); };
      });
    } catch (e) {
      target.innerHTML = `<div class="alert error">${escapeHtml(e.message)}</div>`;
    }
  }

  function showAuditDetail(r) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-card">
        <h2>Detalle de auditoría</h2>
        <p class="muted">${escapeHtml(r.ACCION)} · ${escapeHtml(r.REGISTRO)}</p>
        <div class="field"><label>Información anterior</label><textarea readonly>${escapeHtml(prettyJson(r.DETALLE_ANTERIOR))}</textarea></div>
        <div class="field"><label>Información posterior</label><textarea readonly>${escapeHtml(prettyJson(r.DETALLE_NUEVO))}</textarea></div>
        <div class="actions"><button class="btn btn-secondary" id="closeAudit">Cerrar</button></div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector('#closeAudit').onclick = function() { overlay.remove(); };
  }

  function prettyJson(value) {
    if (!value) return 'Sin información';
    try { return JSON.stringify(JSON.parse(value), null, 2); } catch (e) { return String(value); }
  }

  function renderInfo(title, text) {
    setActive(state.view, title);
    $('#view').innerHTML = `<div class="panel"><h2>${escapeHtml(title)}</h2><p>${escapeHtml(text)}</p></div>`;
  }

  function requestReason(title, text, onConfirm) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-card">
        <h2>${escapeHtml(title)}</h2>
        <p class="muted">${escapeHtml(text)}</p>
        <div class="field"><label>Motivo obligatorio</label><textarea id="modalReason" autofocus></textarea></div>
        <div class="actions">
          <button class="btn btn-primary" id="modalConfirm">Confirmar</button>
          <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const close = function() { overlay.remove(); };
    overlay.querySelector('#modalCancel').onclick = close;
    overlay.onclick = function(e) { if (e.target === overlay) close(); };
    overlay.querySelector('#modalConfirm').onclick = async function() {
      const reason = overlay.querySelector('#modalReason').value.trim();
      if (!reason) { overlay.querySelector('#modalReason').focus(); return; }
      close();
      await onConfirm(reason);
    };
    setTimeout(function() { overlay.querySelector('#modalReason').focus(); }, 0);
  }

  function inputField(name, label, value, type) {
    return `<div class="field"><label>${label}</label><input name="${name}" type="${type || 'text'}" value="${escapeHtml(value || '')}"></div>`;
  }

  function selectField(name, label, value, options) {
    return `<div class="field"><label>${label}</label><select name="${name}">${options.map(function(o) {
      return `<option value="${escapeHtml(o)}" ${String(o) === String(value || '') ? 'selected' : ''}>${escapeHtml(o ? o.replace(/_/g, ' ') : 'Seleccione')}</option>`;
    }).join('')}</select></div>`;
  }

  function detail(label, value) {
    return `<div class="detail"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value || '—')}</strong></div>`;
  }

  function dateValue(value) {
    if (!value) return '';
    if (value instanceof Date) return value.toISOString().slice(0, 10);
    const s = String(value);
    return s.indexOf('T') >= 0 ? s.slice(0, 10) : s;
  }

  function dateTimeValue(value) {
    if (!value) return '';
    const s = String(value);
    return s.length >= 16 ? s.slice(0, 16) : s;
  }

  function dateTimeLabel(value) {
    if (!value) return '—';
    return String(value).replace('T', ' ').slice(0, 16);
  }

  function statusTag(value) {
    const v = String(value || 'SIN_ESTADO');
    return `<span class="tag status-${escapeHtml(v.toLowerCase())}">${escapeHtml(v.replace(/_/g, ' '))}</span>`;
  }

  function catalogItems(type) {
    return (state.boot && state.boot.catalogos && state.boot.catalogos[type]) || [];
  }

  function catalogSelect(name, label, value, type, allowBlank) {
    const items = catalogItems(type);
    return `<div class="field"><label>${label}</label><select name="${name}">${allowBlank !== false ? '<option value="">Seleccione</option>' : ''}${items.map(function(i) {
      return `<option value="${escapeHtml(i.CODIGO)}" ${String(i.CODIGO) === String(value || '') ? 'selected' : ''}>${escapeHtml(i.ETIQUETA || i.CODIGO)}</option>`;
    }).join('')}</select></div>`;
  }

  function bindSubrubros(scope) {
    const root = typeof scope === 'string' ? document.querySelector(scope) : scope;
    const rubro = root && root.querySelector('[name="ID_RUBRO"]');
    const sub = root && root.querySelector('[name="ID_SUBRUBRO"]');
    if (!rubro || !sub) return;
    const current = sub.value, all = catalogItems('SUBRUBRO');
    const update = function() {
      const allowed = SUBRUBROS_POR_RUBRO[rubro.value] || [];
      sub.innerHTML = '<option value="">Seleccione</option>' + all.filter(function(x) {
        return allowed.indexOf(x.CODIGO) >= 0;
      }).map(function(x) {
        return `<option value="${escapeHtml(x.CODIGO)}">${escapeHtml(x.ETIQUETA || x.CODIGO)}</option>`;
      }).join('');
      if (allowed.indexOf(current) >= 0) sub.value = current;
    };
    rubro.onchange = function() { sub.value = ''; update(); };
    update();
  }

  // Inicializar al cargar el DOM
  init();
</script>

</body>
</html>
