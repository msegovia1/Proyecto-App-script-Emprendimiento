  window.cambiarMercadoSeleccion = async function(idIniciativa) {
    if (!idIniciativa) return;
    const tbody = document.getElementById('tablaPostulantesBody');
    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-slate-400">Consultando postulaciones en Turso...</td></tr>';
    }

    try {
      // 1. Obtener datos de la iniciativa y métricas
      const resDetalle = await call('apiDetalleMercadoIntegral', idIniciativa);
      if (resDetalle && resDetalle.success && resDetalle.data) {
        iniciativaSeleccionadaActual = resDetalle.data.iniciativa;
        const m = resDetalle.data.metricas || {};
        const ini = resDetalle.data.iniciativa || {};

        const elTot = document.getElementById('selTotalPostulantes');
        const elTit = document.getElementById('selTitularesCupo');
        const elSup = document.getElementById('selSuplentesCupo');

        if (elTot) elTot.textContent = m.totalPostulantes || 0;
        if (elTit) elTit.textContent = `${m.titularesConfirmados || 0} / ${ini.cupos_titulares || 20}`;
        if (elSup) elSup.textContent = `${m.suplentes || 0} / ${ini.cupos_suplentes || 10}`;
      }

      // 2. Obtener lista de postulaciones detalladas (Camino 1)
      const resPost = await call('apiListarPostulacionesMercado', idIniciativa);
      if (resPost && resPost.success) {
        listaPostulacionesMercadoActual = resPost.data || [];
        const badge = document.getElementById('badgeConteoPostulantes');
        if (badge) badge.textContent = listaPostulacionesMercadoActual.length;

        // Actualizar contador y título de seleccionados
        const seleccionados = listaPostulacionesMercadoActual.filter(p => p.estado_postulacion === 'TITULAR' || p.estado_postulacion === 'SUPLENTE');
        const badgeSel = document.getElementById('badgeConteoSeleccionados');
        if (badgeSel) badgeSel.textContent = seleccionados.length;
        const lblNom = document.getElementById('lblMercadoNominaSeleccionados');
        if (lblNom && iniciativaSeleccionadaActual) {
          lblNom.textContent = iniciativaSeleccionadaActual.nombre || 'Mercado Actual';
        }

        filtrarTablaPostulantes();
        if (tabSeleccionActiva === 'seleccionados') {
          renderPanelSeleccionados();
        }
      } else {
        if (tbody) tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-6 text-center text-rose-500">${resPost?.error || 'Error al obtener postulaciones'}</td></tr>`;
      }
    } catch (err) {
      if (tbody) tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-6 text-center text-rose-500">Error: ${escapeHtml(err.message)}</td></tr>`;
    }
  };

  // --- FILTRADO Y RENDER DE CAMINO 1: POSTULANTES ---
  window.filtrarTablaPostulantes = function() {
    const texto = (document.getElementById('filtroTextoPostulantes')?.value || '').toLowerCase().trim();
    const rubro = document.getElementById('filtroRubroPostulantes')?.value || '';
    const estado = document.getElementById('filtroEstadoPostulantes')?.value || '';
    const formSii = document.getElementById('filtroFormalizacionPostulantes')?.value || '';

    const filtrados = listaPostulacionesMercadoActual.filter(p => {
      const matchTexto = !texto || 
        (p.nombre_comercial && p.nombre_comercial.toLowerCase().includes(texto)) ||
        (p.nombres && p.nombres.toLowerCase().includes(texto)) ||
        (p.apellidos && p.apellidos.toLowerCase().includes(texto)) ||
        (p.rut && p.rut.toLowerCase().includes(texto)) ||
        (p.rut_formateado && p.rut_formateado.toLowerCase().includes(texto));

      const matchRubro = !rubro || (p.rubro === rubro);
      const matchEstado = !estado || (p.estado_postulacion === estado);
      const matchForm = !formSii || (p.formalizacion_sii === formSii);

      return matchTexto && matchRubro && matchEstado && matchForm;
    });

    renderTablaPostulaciones(filtrados);
    actualizarContadorPostulantesSeleccionados();
  };

  function renderTablaPostulaciones(lista) {
    const tbody = document.getElementById('tablaPostulantesBody');
    if (!tbody) return;

    if (!lista || lista.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-slate-400">No hay postulaciones que coincidan con los filtros.</td></tr>';
      return;
    }

    tbody.innerHTML = lista.map(p => {
      const rut = p.rut_formateado || p.rut || '—';
      const nombreTitular = `${p.nombres || ''} ${p.apellidos || ''}`.trim() || 'Sin Nombre';
      const negocio = p.nombre_comercial || p.nombre_fantasia || 'Sin negocio';
      const rubro = p.rubro || 'OTRO';
      const subrubro = p.subrubro || '';
      const formalizacion = (p.formalizacion_sii || 'SIN_INICIO').replace(/_/g, ' ');
      const rsh = p.tramo_rsh ? `${p.tramo_rsh}% RSH` : 'Sin RSH';
      const estado = p.estado_postulacion || 'INGRESADA';

      let estadoClase = 'bg-slate-100 text-slate-700 border-slate-200';
      if (estado === 'TITULAR') estadoClase = 'bg-emerald-100 text-emerald-800 border-emerald-300 font-bold';
      else if (estado === 'SUPLENTE') estadoClase = 'bg-amber-100 text-amber-800 border-amber-300 font-bold';
      else if (estado === 'ADMISIBLE') estadoClase = 'bg-blue-100 text-blue-800 border-blue-200';

    const rubro = document.getElementById('filtroRubroDisponibles')?.value || '';
    const formSii = document.getElementById('filtroFormalizacionDisponibles')?.value || '';
    const comuna = document.getElementById('filtroComunaDisponibles')?.value || '';

    const filtrados = listaDisponiblesMercadoActual.filter(e => {
      const matchTexto = !texto ||
        (e.nombre_comercial && e.nombre_comercial.toLowerCase().includes(texto)) ||
        (e.nombres && e.nombres.toLowerCase().includes(texto)) ||
        (e.apellidos && e.apellidos.toLowerCase().includes(texto)) ||
        (e.rut && e.rut.toLowerCase().includes(texto)) ||
        (e.rut_formateado && e.rut_formateado.toLowerCase().includes(texto));

      const matchRubro = !rubro || (e.rubro === rubro);
      const matchForm = !formSii || (e.formalizacion_sii === formSii);
      const matchComuna = !comuna || (e.comuna === comuna);

      return matchTexto && matchRubro && matchForm && matchComuna;
    });

    renderTablaDisponibles(filtrados);
    actualizarContadorDisponiblesSeleccionados();

        (p.apellidos && p.apellidos.toLowerCase().includes(texto)) ||
        (p.rut && p.rut.toLowerCase().includes(texto)) ||
        (p.rut_formateado && p.rut_formateado.toLowerCase().includes(texto)) ||
        (p.rubro && p.rubro.toLowerCase().includes(texto)) ||

  // =========================================================
  // MÓDULO DE EXPORTACIÓN A EXCEL (COMPATIBLE .CSV UTF-8 BOM)
  // =========================================================
  window.descargarArchivoCSV = function(nombreArchivo, encabezados, filas) {
    try {
      const escapar = (val) => {
        if (val === null || val === undefined) return '""';
        let s = String(val).trim();
        if (s.includes('"') || s.includes(';') || s.includes('\n') || s.includes('\r')) {
          s = s.replace(/"/g, '""');
        }
        return `"${s}"`;
      };

      const lineaEncabezados = encabezados.map(escapar).join(';');
      const lineasFilas = filas.map(fila => fila.map(escapar).join(';'));
      const contenidoCompleto = [lineaEncabezados, ...lineasFilas].join('\r\n');

      const blob = new Blob(['\uFEFF' + contenidoCompleto], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', nombreArchivo.endsWith('.csv') ? nombreArchivo : nombreArchivo + '.csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      mostrarToast(`Archivo "${nombreArchivo}" generado y descargado exitosamente.`, 'success');
    } catch (err) {
      console.error('Error al exportar CSV:', err);
      mostrarToast('Error al generar la exportación: ' + err.message, 'error');
    }
  };

    if (jornadasSeguimientoActual.length <= 1) {

    preservarEstadoInputsSeguimiento();

    renderCabeceraSeguimiento();
    renderPildorasJornadas();

  function preservarEstadoInputsSeguimiento() {
    const filas = document.querySelectorAll('#tablaSeguimientoMasivoBody tr[data-emprendimiento-id]');
    filas.forEach(f => {
      const idEmp = f.getAttribute('data-emprendimiento-id');
      const item = listaParticipantesSeguimientoActual.find(p => p.id_emprendimiento === idEmp);
      if (!item) return;

      item.asistio = f.querySelector('.seg-input-asistio')?.value || 'SI';
      item.ventas_diarias = item.ventas_diarias || {};

      jornadasSeguimientoActual.forEach(j => {
        const inputDia = f.querySelector(`.seg-input-dia[data-jornada="${j}"]`);
        if (inputDia) {
          item.ventas_diarias[j] = parseFloat(inputDia.value) || 0;
        }
      });

      item.seguidores_antes = parseInt(f.querySelector('.seg-input-seg-antes')?.value, 10) || 0;
      item.seguidores_despues = parseInt(f.querySelector('.seg-input-seg-despues')?.value, 10) || 0;
      item.evaluacion_general = f.querySelector('.seg-input-eval')?.value || 'BUENA';
      item.observaciones = f.querySelector('.seg-input-obs')?.value || '';
    });
  }

                   class="seg-input-seg-antes w-full text-xs px-2 py-1.5 border border-slate-300 rounded-lg font-mono text-center focus:ring-1 focus:ring-teal-500" 
                   placeholder="Antes" oninput="recalcularTotalesSeguimientoEnVivo()">
          </td>
          <td class="px-2 py-3">
            <input type="number" min="0" value="${segDespues}" 
                   class="seg-input-seg-despues w-full text-xs px-2 py-1.5 border border-slate-300 rounded-lg font-mono text-center focus:ring-1 focus:ring-teal-500" 
                   placeholder="Después" oninput="recalcularTotalesSeguimientoEnVivo()">
          </td>
          <td class="px-2 py-3 text-center">
            <span class="seg-lbl-delta inline-flex items-center px-2 py-0.5 rounded text-[11px] font-mono font-bold ${deltaInicial >= 0 ? 'bg-purple-50 text-purple-700 border border-purple-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}">
              ${deltaInicial >= 0 ? '+' + deltaInicial : deltaInicial}
            </span>
          </td>
          <td class="px-3 py-3">
            <select class="seg-input-eval w-full text-xs px-2 py-1.5 border border-slate-300 rounded-lg bg-white font-medium focus:ring-1 focus:ring-teal-500">
              <option value="EXCELENTE" ${evaluacion === 'EXCELENTE' ? 'selected' : ''}>⭐ Excelente</option>
              <option value="BUENA" ${evaluacion === 'BUENA' ? 'selected' : ''}>👍 Buena</option>
              <option value="REGULAR" ${evaluacion === 'REGULAR' ? 'selected' : ''}>⚠️ Regular</option>
              <option value="DEFICIENTE" ${evaluacion === 'DEFICIENTE' ? 'selected' : ''}>👎 Deficiente</option>
            </select>
          </td>
          <td class="px-3 py-3">
            <input type="text" value="${escapeHtml(obs)}" 
                   class="seg-input-obs w-full text-xs px-2 py-1.5 border border-slate-300 rounded-lg focus:ring-1 focus:ring-teal-500" 
                   placeholder="Notas del puesto o incidencias...">
          </td>
        </tr>
      `;
    }).join('');
  }

  // Recalcular en tiempo real ventas por día, total acumulado, comparativa y seguidores
  window.recalcularTotalesSeguimientoEnVivo = function() {
    const filas = document.querySelectorAll('#tablaSeguimientoMasivoBody tr[data-emprendimiento-id]');
    let totalVentasGeneral = 0;
    let totalDeltaSeguidores = 0;
    let asistieronCount = 0;
    const totalParticipantes = filas.length;

    // Mapa de ventas acumuladas por día: { 'Día 1': 0, 'Día 2': 0, ... }
    const acumuladoPorDia = {};
    jornadasSeguimientoActual.forEach(j => {
      acumuladoPorDia[j] = 0;
    });

    filas.forEach(f => {
      const asistio = f.querySelector('.seg-input-asistio')?.value;
      if (asistio === 'SI') asistieronCount++;

      // Sumar días para este emprendedor
      let sumaEmprendedor = 0;
      jornadasSeguimientoActual.forEach(j => {
        const inputDia = f.querySelector(`.seg-input-dia[data-jornada="${j}"]`);
        const montoDia = parseFloat(inputDia?.value) || 0;
        sumaEmprendedor += montoDia;
        acumuladoPorDia[j] += montoDia;
      });

      // Actualizar celda de Total Ventas de la fila
      const lblTotalFila = f.querySelector('.seg-lbl-total-fila');
      if (lblTotalFila) {
        lblTotalFila.textContent = '$' + Number(sumaEmprendedor).toLocaleString('es-CL');
      }
      totalVentasGeneral += sumaEmprendedor;

      // Calcular seguidores
      const segAntes = parseInt(f.querySelector('.seg-input-seg-antes')?.value, 10) || 0;
      const segDespues = parseInt(f.querySelector('.seg-input-seg-despues')?.value, 10) || 0;
      const delta = segDespues - segAntes;
      totalDeltaSeguidores += delta;

      const lblDelta = f.querySelector('.seg-lbl-delta');
      if (lblDelta) {
        lblDelta.textContent = delta >= 0 ? `+${delta}` : String(delta);
        if (delta >= 0) {
          lblDelta.className = 'seg-lbl-delta inline-flex items-center px-2 py-0.5 rounded text-[11px] font-mono font-bold bg-purple-50 text-purple-700 border border-purple-200';
        } else {
          lblDelta.className = 'seg-lbl-delta inline-flex items-center px-2 py-0.5 rounded text-[11px] font-mono font-bold bg-rose-50 text-rose-700 border border-rose-200';
        }
      }
    });

    // Formatear montos generales
    const fmVentas = '$' + Number(totalVentasGeneral).toLocaleString('es-CL');
    const fmSeguidores = (totalDeltaSeguidores >= 0 ? '+' : '') + Number(totalDeltaSeguidores).toLocaleString('es-CL');

    // Badges superiores
    const bPart = document.getElementById('segTotalParticipantesBadge');
    const bAsis = document.getElementById('segTotalAsistieronBadge');
    const bVent = document.getElementById('segTotalVentasBadge');
    const bSeg = document.getElementById('segTotalSeguidoresBadge');
    const lblSumaV = document.getElementById('lblSumaVentasEnVivo');
    const lblSumaSeg = document.getElementById('lblSumaSeguidoresEnVivo');
    const lblDesgloseDias = document.getElementById('lblDesgloseDiasEnVivo');

    if (bPart) bPart.textContent = totalParticipantes;
    if (bAsis) bAsis.textContent = asistieronCount;
    if (bVent) bVent.textContent = fmVentas;
    if (bSeg) bSeg.textContent = fmSeguidores;
    if (lblSumaV) lblSumaV.textContent = fmVentas;
    if (lblSumaSeg) lblSumaSeg.textContent = fmSeguidores;

    // Desglose compacto en el pie de tabla
    if (lblDesgloseDias) {
      const fragmentos = Object.entries(acumuladoPorDia).map(([dia, m]) => `${dia}: $${Number(m).toLocaleString('es-CL')}`);
      lblDesgloseDias.textContent = fragmentos.join(' · ');
    }

    // Actualizar Panel Analítico Comparativo de Ventas Diarias
    actualizarPanelAnalisisVentasDiarias(acumuladoPorDia, totalVentasGeneral, asistieronCount || totalParticipantes);
  };

  // Actualizar métricas comparativas del panel analítico
  function actualizarPanelAnalisisVentasDiarias(acumuladoPorDia, totalVentas, cantParticipantesEfectivos) {
    const entries = Object.entries(acumuladoPorDia);
    if (entries.length === 0) return;

    let diaMayor = entries[0];
    let diaMenor = entries[0];

    for (let i = 1; i < entries.length; i++) {
      if (entries[i][1] > diaMayor[1]) {
        diaMayor = entries[i];
      }
      if (entries[i][1] < diaMenor[1]) {
        diaMenor = entries[i];
      }
    }

    // Actualizar Tarjeta Día Mayor Venta
    const badgeMayor = document.getElementById('badgeDiaMayorVenta');
    const montoMayor = document.getElementById('montoDiaMayorVenta');
    if (badgeMayor && montoMayor) {
      if (totalVentas > 0) {
        badgeMayor.textContent = `${diaMayor[0]}`;
        const pctMayor = Math.round((diaMayor[1] / totalVentas) * 100);
        montoMayor.textContent = `$${Number(diaMayor[1]).toLocaleString('es-CL')} (${pctMayor}% de la feria)`;
      } else {
        badgeMayor.textContent = 'Sin ventas registradas';
        montoMayor.textContent = '$0';
      }
    }

    // Actualizar Tarjeta Día Menor Venta
    const badgeMenor = document.getElementById('badgeDiaMenorVenta');
    const montoMenor = document.getElementById('montoDiaMenorVenta');
    if (badgeMenor && montoMenor) {
      if (totalVentas > 0) {
        badgeMenor.textContent = `${diaMenor[0]}`;
        const pctMenor = Math.round((diaMenor[1] / totalVentas) * 100);
        montoMenor.textContent = `$${Number(diaMenor[1]).toLocaleString('es-CL')} (${pctMenor}% de la feria)`;
      } else {
        badgeMenor.textContent = 'Sin ventas registradas';
        montoMenor.textContent = '$0';
      }
    }

    // Actualizar Promedio por Emprendimiento
    const badgePromedio = document.getElementById('badgePromedioVentasEmp');
    const subPromedio = document.getElementById('badgeSubtextoPromedio');
    if (badgePromedio) {
      const promedio = cantParticipantesEfectivos > 0 ? Math.round(totalVentas / cantParticipantesEfectivos) : 0;
      badgePromedio.textContent = `$${Number(promedio).toLocaleString('es-CL')}`;
      if (subPromedio) {
        subPromedio.textContent = `En base a ${cantParticipantesEfectivos} emprendimientos`;
      }
    }

    // Renderizar barras comparativas de distribución
    const contenedorBarras = document.getElementById('contenedorBarrasDistribucionDias');
    if (contenedorBarras) {
      contenedorBarras.innerHTML = entries.map(([dia, monto]) => {
        const pct = totalVentas > 0 ? Math.round((monto / totalVentas) * 100) : 0;
        const esMayor = totalVentas > 0 && dia === diaMayor[0];
        const esMenor = totalVentas > 0 && dia === diaMenor[0] && entries.length > 1;

        let badgeIndicador = '';
        if (esMayor) {
          badgeIndicador = '<span class="px-1.5 py-0.5 rounded text-[10px] font-extrabold bg-emerald-100 text-emerald-800 ml-2">🏆 Más Ventas</span>';
        } else if (esMenor) {
          badgeIndicador = '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-800 ml-2">Menos Ventas</span>';
        }

        return `
          <div class="space-y-1">
            <div class="flex items-center justify-between text-xs">
              <div class="font-bold text-slate-700 flex items-center">
                <span>${escapeHtml(dia)}</span>
                ${badgeIndicador}
              </div>
              <div class="font-mono font-bold text-slate-800">
                $${Number(monto).toLocaleString('es-CL')} <span class="text-slate-400 font-normal">(${pct}%)</span>
              </div>
            </div>
            <div class="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden">
              <div class="h-full rounded-full transition-all duration-300 ${esMayor ? 'bg-emerald-500' : 'bg-teal-500'}" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');
    }
  }

  // Guardar en Turso el seguimiento masivo con el desglose por día
  window.guardarSeguimientoMasivoEnTerreno = async function() {
    const idIniciativa = document.getElementById('segIniciativaMasivo')?.value;
    if (!idIniciativa) {
      mostrarToast('Seleccione una iniciativa a evaluar.', 'error');
      return;
    }

    const filasEls = document.querySelectorAll('#tablaSeguimientoMasivoBody tr[data-emprendimiento-id]');
    if (filasEls.length === 0) {
      mostrarToast('No hay participantes en la grilla para guardar.', 'error');
      return;
    }

    const payloadFilas = [];

    filasEls.forEach(f => {
      const idEmp = f.getAttribute('data-emprendimiento-id');
      const asistio = f.querySelector('.seg-input-asistio')?.value || 'SI';

      // Recopilar ventas por cada día
      const ventasDiarias = {};
      let ventasTotales = 0;
      jornadasSeguimientoActual.forEach(j => {
        const inputDia = f.querySelector(`.seg-input-dia[data-jornada="${j}"]`);
        const val = parseFloat(inputDia?.value) || 0;
        ventasDiarias[j] = val;
        ventasTotales += val;
      });

      const segAntes = parseInt(f.querySelector('.seg-input-seg-antes')?.value, 10) || 0;
      const segDespues = parseInt(f.querySelector('.seg-input-seg-despues')?.value, 10) || 0;
      const deltaSeg = segDespues - segAntes;
      const evaluacion = f.querySelector('.seg-input-eval')?.value || 'BUENA';
      const obs = f.querySelector('.seg-input-obs')?.value || '';

      if (idEmp) {
        payloadFilas.push({
          idEmprendimiento: idEmp,
          asistio: asistio,
          ventasDiarias: ventasDiarias,
          ventasTotalesReportadas: ventasTotales,
          seguidoresAntes: segAntes,
          seguidoresDespues: segDespues,
          seguidoresGanados: deltaSeg,
          evaluacionGeneral: evaluacion,
          observaciones: obs
        });
      }
    });

    try {
      mostrarToast('Guardando seguimiento y desglose por día en Turso...', 'info');
      const res = await call('apiGuardarSeguimientoMasivo', {
        idIniciativa: idIniciativa,
        jornadas: jornadasSeguimientoActual,
        filas: payloadFilas
      });

      if (res && res.success) {
        mostrarToast(`✓ Se guardó exitosamente el seguimiento con ventas por día de ${payloadFilas.length} participantes en Turso.`, 'success');
        actualizarDashboardCompleto();
        // Recargar para sincronizar cálculos y estado oficial
        cargarParticipantesSeguimientoMasivo(idIniciativa);
      } else {
        mostrarToast(res?.error || 'Error al guardar seguimiento masivo', 'error');
      }
    } catch (err) {
      mostrarToast(err.message, 'error');
    }
  };

  // =========================================================
  // MODAL EXPEDIENTE DIGITAL Y REVISIÓN DE CALIDAD
  // =========================================================
  window.abrirModalDocumentosEmprendedor = async function(idEmprendedor, nombreNegocio, nombreTitular, rut, rubro) {
    const modal = document.getElementById('modalExpedienteDocumentos');
    if (!modal) return;

    const elNom = document.getElementById('docModalNombreEmprendimiento');
    if (elNom) elNom.textContent = nombreNegocio || 'Emprendimiento';
    const elTit = document.getElementById('docModalTitularRut');
    if (elTit) elTit.textContent = `${nombreTitular || ''} · ${rut || ''}`;
    const elRub = document.getElementById('docModalRubroBadge');
    if (elRub) elRub.textContent = rubro || 'Rubro General';
    
    // Reseteo diagnósticos
    const elFotoBadge = document.getElementById('diagFotoBadge');
    if (elFotoBadge) {
      elFotoBadge.textContent = 'Consultando...';
      elFotoBadge.className = 'font-bold text-amber-600';
    }
    const elSiiBadge = document.getElementById('diagSiiBadge');
    if (elSiiBadge) elSiiBadge.textContent = 'Consultando...';
    const elSanBadge = document.getElementById('diagSanitariaBadge');
    if (elSanBadge) elSanBadge.textContent = 'Consultando...';
    const elRshBadge = document.getElementById('diagRshBadge');
    if (elRshBadge) elRshBadge.textContent = 'Consultando...';
    
    const listaContainer = document.getElementById('listaDocsExpediente');
    if (listaContainer) {
      listaContainer.innerHTML = '<div class="p-6 text-center text-slate-400 text-xs">Cargando expediente digital desde Google Drive y Turso...</div>';
    }
    const elConteo = document.getElementById('docConteoTotal');
    if (elConteo) elConteo.textContent = '0 documentos';

    modal.classList.remove('hidden');

    try {
      const res = await call('apiListarDocumentosEmprendedor', idEmprendedor);
      const docs = (res && res.success && res.data) ? res.data : [];
      if (elConteo) elConteo.textContent = `${docs.length} documento${docs.length === 1 ? '' : 's'}`;

      let tieneFotos = false;
      let tieneSii = false;
      let tieneSanitaria = false;
      let tieneRsh = false;

      docs.forEach(d => {
        const tipo = (d.tipo_documento || '').toUpperCase();
        if (tipo.includes('FOTO') || tipo.includes('CATALOGO') || tipo.includes('PRODUCTO')) tieneFotos = true;
        if (tipo.includes('INICIO') || tipo.includes('SII') || tipo.includes('ACTIVIDAD')) tieneSii = true;
        if (tipo.includes('SANITARIA') || tipo.includes('SEREMI')) tieneSanitaria = true;
        if (tipo.includes('HOGARES') || tipo.includes('RSH') || tipo.includes('REGISTRO_SOCIAL')) tieneRsh = true;
      });

      // Indicadores
      const elFoto = document.getElementById('diagFotoBadge');
      if (elFoto) {
        if (tieneFotos) {
          elFoto.textContent = '✓ Fotos Registradas';
          elFoto.className = 'font-bold text-emerald-700';
        } else {
          elFoto.textContent = '⚠️ Sin fotos de muestras';
          elFoto.className = 'font-bold text-amber-700';
        }
      }

      const elSii = document.getElementById('diagSiiBadge');
      if (elSii) {
        if (tieneSii) {
          elSii.textContent = '✓ Inicio SII Válido';
          elSii.className = 'font-bold text-emerald-700';
        } else {
          elSii.textContent = 'Pendiente / Informal';
          elSii.className = 'font-bold text-slate-500';
        }
      }

      const elSan = document.getElementById('diagSanitariaBadge');
      if (elSan) {
        const esRubroAlimento = (rubro || '').toUpperCase().includes('ALIMENT') || (rubro || '').toUpperCase().includes('GASTRONOM') || (rubro || '').toUpperCase().includes('COSMET');
        if (tieneSanitaria) {
          elSan.textContent = '✓ Res. Sanitaria OK';
          elSan.className = 'font-bold text-emerald-700';
        } else if (esRubroAlimento) {
          elSan.textContent = '⚠️ Res. Exigible';
          elSan.className = 'font-bold text-rose-700';
        } else {
          elSan.textContent = 'No exigible';
          elSan.className = 'font-bold text-slate-400';
        }
      }

      const elRsh = document.getElementById('diagRshBadge');
      if (elRsh) {
        if (tieneRsh) {
          elRsh.textContent = '✓ Cartola RSH';
          elRsh.className = 'font-bold text-emerald-700';
        } else {
          elRsh.textContent = 'Sin cartola';
          elRsh.className = 'font-bold text-slate-400';
        }
      }

      if (docs.length === 0) {
        if (listaContainer) {
          listaContainer.innerHTML = `
            <div class="p-8 text-center text-slate-400 text-xs space-y-2">
              <div class="text-2xl">📄</div>
              <p>Este emprendedor aún no registra documentos cargados en su carpeta de Google Drive.</p>
              <p class="text-[11px] text-slate-400">Puede solicitarle los archivos o cargarlos directamente desde la pestaña "Expediente".</p>
            </div>
          `;
        }
        return;
      }

      if (listaContainer) {
        listaContainer.innerHTML = docs.map(d => {
          const esFoto = (d.mime_type || '').startsWith('image/') || (d.tipo_documento || '').includes('FOTO');
          const icono = esFoto ? '🖼️' : '📄';
          const urlDrive = d.drive_url || '#';
          const fecha = d.creado_en ? String(d.creado_en).substring(0, 10) : 'Fecha s/r';
          const tipoLegible = (d.tipo_documento || 'DOCUMENTO').replace(/_/g, ' ');

          return `
            <div class="p-3 flex items-center justify-between gap-3 hover:bg-slate-50 transition text-xs">
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="text-lg">${icono}</span>
                <div class="min-w-0">
                  <div class="font-bold text-slate-800 truncate">${escapeHtml(d.nombre_archivo || tipoLegible)}</div>
                  <div class="text-[11px] text-slate-500 flex items-center gap-2">
                    <span class="font-semibold text-muni-700">${escapeHtml(tipoLegible)}</span>
                    <span>·</span>
                    <span>${escapeHtml(fecha)}</span>
                    <span>·</span>
                    <span class="px-1.5 py-0.2 rounded text-[10px] bg-emerald-50 text-emerald-700 font-semibold border border-emerald-200">
                      ${escapeHtml(d.estado_revision || 'VIGENTE')}
                    </span>
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-2 flex-shrink-0">
                ${d.drive_url ? `
                  <a href="${d.drive_url}" target="_blank" rel="noopener noreferrer" 
                     class="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold text-xs rounded-lg border border-blue-200 transition flex items-center gap-1">
                    <span>Abrir en Drive</span>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                  </a>
                ` : `
                  <span class="text-[11px] text-slate-400 italic">Registrado en Turso</span>
                `}
              </div>
            </div>
          `;
        }).join('');
      }
    } catch (e) {
      if (listaContainer) {
        listaContainer.innerHTML = `<div class="p-6 text-center text-rose-500 text-xs">Error consultando documentos: ${escapeHtml(e.message)}</div>`;
      }
    }
  };

  window.cerrarModalDocumentos = function() {
    const modal = document.getElementById('modalExpedienteDocumentos');
    if (modal) modal.classList.add('hidden');
  };

  // Inicializar vista principal por defecto
  setTimeout(() => {
    actualizarDashboardCompleto();
  }, 300);

  // Inicializar compatibilidad si aplica
  try {
    init();
  } catch (errInit) {
    console.warn('Init skip:', errInit);
  }
</script>
