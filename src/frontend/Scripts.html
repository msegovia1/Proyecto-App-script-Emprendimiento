<script>
  // ===== Scripts.html =====
  // SGE v2.1.0 - Ficha integral del emprendedor
  // Controlador frontend, enrutamiento de vistas y comunicación RPC con Google Apps Script

  const state = {
    boot: null,
    view: 'inicio',
    pending: 0,
    alertTimer: null
  };

  const SUBRUBROS_POR_RUBRO = {
    ALIMENTACION: ['COMIDA_PREPARADA', 'COLACIONES_COFFEE_BREAK', 'PANADERIA_PASTELERIA', 'REPOSTERIA', 'PRODUCTOS_GOURMET', 'CONSERVAS_ENCURTIDOS', 'BEBESTIBLES'],
    ARTESANIA: ['ARTESANIA_TRADICIONAL', 'CERAMICA_ALFARERIA', 'MADERA', 'CUERO', 'JOYERIA_BISUTERIA', 'TEJIDOS', 'DECORACION_HOGAR', 'ILUSTRACION_DISENO'],
    TEXTIL: ['CONFECCION_VESTUARIO', 'TEJIDOS', 'BOLSOS_ACCESORIOS_TEXTILES', 'CALZADO'],
    BELLEZA_CUIDADO_PERSONAL: ['COSMETICA_NATURAL', 'PELUQUERIA_BARBERIA', 'MANICURE_ESTETICA', 'BIENESTAR_CUIDADO_PERSONAL'],
    COMERCIO: ['ALMACEN_REGALERIA', 'LIBRERIA_PAPELERIA', 'REVENTA_COMERCIO'],
    SERVICIOS: ['ASESORIAS_PROFESIONALES', 'SERVICIOS_PERSONALES', 'OFICIOS_REPARACIONES'],
    TECNOLOGIA: ['DESARROLLO_WEB_SOFTWARE', 'MARKETING_DISENO_DIGITAL', 'TECNOLOGIA_SERVICIOS_DIGITALES'],
    TURISMO: ['TURISMO_EXPERIENCIAS', 'GASTRONOMIA_TURISTICA'],
    ECONOMIA_CIRCULAR: ['RECICLAJE_REUTILIZACION', 'PRODUCTOS_SUSTENTABLES'],
    OTRO: ['OTRO']
  };

  const DOCUMENTOS_FICHA_V210 = [
    { codigo: 'CEDULA_IDENTIDAD_COMPLETA', etiqueta: 'Cédula por ambos lados (único archivo)', sujeto: 'PERSONA', obligatorio: true },
    { codigo: 'REGISTRO_SOCIAL_HOGARES', etiqueta: 'Registro Social de Hogares', sujeto: 'PERSONA', obligatorio: true },
    { codigo: 'ACREDITACION_DISCAPACIDAD', etiqueta: 'Credencial de discapacidad o pensión de invalidez', sujeto: 'PERSONA', obligatorio: false },
    { codigo: 'INICIO_ACTIVIDADES', etiqueta: 'Certificado inicio de actividades', sujeto: 'EMPRENDIMIENTO', obligatorio: false, mercado: true },
    { codigo: 'FICHA_TECNICA_PRODUCTOS', etiqueta: 'Ficha técnica de productos o servicios', sujeto: 'EMPRENDIMIENTO', obligatorio: false }
  ];

  const $ = function(selector) { return document.querySelector(selector); };

  function beginBusy(text) {
    state.pending++;
    if ($('#busyText')) $('#busyText').textContent = text || 'Procesando…';
    const busy = $('#busy');
    if (busy) busy.classList.remove('hidden');
  }

  function endBusy() {
    state.pending = Math.max(0, state.pending - 1);
    if (!state.pending) {
      const busy = $('#busy');
      if (busy) busy.classList.add('hidden');
    }
  }

  function call(name) {
    const args = Array.prototype.slice.call(arguments, 1);
    beginBusy();
    return new Promise(function(resolve, reject) {
      google.script.run
        .withSuccessHandler(function(response) {
          endBusy();
          resolve(response);
        })
        .withFailureHandler(function(error) {
          endBusy();
          reject(error);
        })[name].apply(google.script.run, args);
    });
  }

  function callForm(name, form) {
    beginBusy('Cargando archivo…');
    return new Promise(function(resolve, reject) {
      google.script.run
        .withSuccessHandler(function(response) {
          endBusy();
          resolve(response);
        })
        .withFailureHandler(function(error) {
          endBusy();
          reject(error);
        })[name](form);
    });
  }

  function hasPerm(perm) {
    const p = (state.boot && state.boot.permisos) || [];
    return p.indexOf('*') >= 0 || p.indexOf(perm) >= 0;
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>'"]/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c];
    });
  }

  function alertMsg(message, type) {
    type = type || 'ok';
    const el = $('#alert');
    if (!el) return;
    el.textContent = message;
    el.className = 'alert ' + type;
    clearTimeout(state.alertTimer);
    state.alertTimer = setTimeout(function() { el.classList.add('hidden'); }, 7000);
  }

  function assertOk(response) {
    if (!response || !response.ok) throw new Error((response && response.error && response.error.message) || 'Ocurrió un error');
    return response.data;
  }

  async function init() {
    try {
      state.boot = assertOk(await call('apiBootstrap'));
      const ub = $('#userBadge');
      if (ub && state.boot && state.boot.usuario) {
        ub.textContent = (state.boot.usuario.EMAIL || '') + ' · ' + (state.boot.usuario.ROL || '');
      }
      const ld = $('#loading');
      if (ld) ld.classList.add('hidden');
      const ap = $('#app');
      if (ap) ap.classList.remove('hidden');
      if ($('#view') && typeof render === 'function') {
        render('inicio');
      }
    } catch (error) {
      const ld = $('#loading');
      if (ld) ld.textContent = 'No fue posible iniciar el sistema: ' + error.message;
      console.warn('apiBootstrap notice:', error);
    }
  }

  document.addEventListener('click', function(e) {
    const button = e.target.closest('[data-view]');
    if (button && typeof render === 'function') render(button.dataset.view);
  });

  function setActive(view, title) {
    state.view = view;
    document.querySelectorAll('[data-view]').forEach(function(b) {
      b.classList.toggle('active', b.dataset.view === view);
    });
    const vt = $('#viewTitle');
    if (vt) vt.textContent = title;
  }

  function render(view) {
    const routes = {
      inicio: renderInicio,
      registro: renderRegistroCompleto,
      buscar: renderBuscar,
      emprendedores: renderEmprendedores,
      personas: renderPersonas,
      emprendimientos: renderEmprendimientos,
      iniciativas: renderIniciativas,
      postulaciones: renderPostulaciones,
      seleccion: renderSeleccionV2,
      documentos: renderDocumentosHub,
      participacion: renderParticipacionV2,
      comunicaciones: renderComunicacionesV2,
      mapa: function() { renderInfo('Mapa', 'La geocodificación queda disponible para direcciones registradas.'); },
      reportes: renderInicio,
      auditoria: renderAuditoria
    };
    (routes[view] || routes.inicio)();
  }

  function labelCodeText(value) {
    const code = String(value || '—');
    if (!state.boot || !state.boot.catalogos) return code.replace(/_/g, ' ');
    const types = Object.keys(state.boot.catalogos);
    for (let i = 0; i < types.length; i++) {
      const item = state.boot.catalogos[types[i]].find(function(x) { return x.CODIGO === code; });
      if (item) return item.ETIQUETA || code;
    }
    return code.replace(/_/g, ' ');
  }

  function barChart(title, values) {
    const rows = Object.keys(values || {}).map(function(k) { return [k, values[k]]; }).sort(function(a, b) { return b[1] - a[1]; });
    const max = Math.max.apply(null, [1].concat(rows.map(function(x) { return x[1]; })));
    return `<div class="chart-card"><h2>${escapeHtml(title)}</h2>${rows.length ? rows.map(function(pair) {
      return `<div class="chart-row"><span class="chart-label" title="${escapeHtml(labelCodeText(pair[0]))}">${escapeHtml(labelCodeText(pair[0]))}</span><span class="chart-track"><span class="chart-bar" style="width:${Math.max(3, pair[1] / max * 100)}%"></span></span><strong>${escapeHtml(pair[1])}</strong></div>`;
    }).join('') : '<div class="empty">Sin datos</div>'}</div>`;
  }

  function googleChartsListosV2() {
    return new Promise(function(resolve) {
      if (!(window.google && google.charts)) return resolve(false);
      google.charts.load('current', { packages: ['corechart', 'bar'] });
      google.charts.setOnLoadCallback(function() { resolve(true); });
    });
  }

  function filasGraficoV2(obj) {
    return Object.keys(obj || {}).map(function(k) { return [String(labelCodeText(k)), Number(obj[k] || 0)]; });
  }

  function dibujarDashboardInteractivoV2(d) {
    googleChartsListosV2().then(function(ok) {
      if (!ok) {
        const info = $('#dashboardChartInfo');
        if (info) info.textContent = 'Gráficos estáticos activos (conecte a internet para gráficos dinámicos).';
        return;
      }
      const palette = ['#4f46e5', '#0d9488', '#ea580c', '#059669', '#7c3aed', '#d97706', '#e11d48', '#0284c7', '#6366f1', '#64748b'];
      const base = {
        backgroundColor: 'transparent',
        legend: { position: 'none' },
        chartArea: { left: 58, top: 30, width: '78%', height: '68%' },
        fontName: 'Arial',
        colors: palette,
        tooltip: { isHtml: true }
      };
      const renderG = function(id, tipo, filas, titulo, op) {
        const el = document.getElementById(id);
        if (!el || !filas.length) return;
        const table = google.visualization.arrayToDataTable([['Categoría', 'Cantidad']].concat(filas));
        const chart = tipo === 'pie' ? new google.visualization.PieChart(el) : new google.visualization.ColumnChart(el);
        google.visualization.events.addListener(chart, 'select', function() {
          const s = chart.getSelection()[0];
          if (s && s.row != null) {
            const x = filas[s.row];
            const info = $('#dashboardChartInfo');
            if (info) info.textContent = 'Filtro seleccionado: ' + x[0] + ' (' + x[1] + ' registros).';
          }
        });
        chart.draw(table, Object.assign({}, base, {
          title: titulo,
          height: 300,
          pieHole: tipo === 'pie' ? 0.42 : undefined,
          legend: tipo === 'pie' ? { position: 'right' } : { position: 'none' },
          hAxis: tipo === 'pie' ? undefined : { slantedText: true, slantedTextAngle: 28 },
          vAxis: tipo === 'pie' ? undefined : { minValue: 0, format: '0' }
        }, op || {}));
      };

      renderG('chartRubro', 'bar', filasGraficoV2(d.porRubro), 'Rubros principales', { colors: ['#4f46e5', '#06b6d4', '#10b981'] });
      renderG('chartFormalizacion', 'bar', filasGraficoV2(d.porFormalizacion), 'Nivel de formalización', { colors: ['#0d9488', '#3b82f6', '#8b5cf6'] });
      renderG('chartComunas', 'pie', filasGraficoV2(d.porComuna), 'Comunas de residencia', { colors: palette });
      renderG('chartEdades', 'bar', filasGraficoV2(d.porEdad), 'Distribución por edades', { colors: ['#ea580c', '#f59e0b', '#10b981', '#3b82f6'] });

      const ventas = [['Momento', 'Ventas'], ['Antes', Number((d.evolucionVentas && d.evolucionVentas.antes) || 0)], ['Durante', Number((d.evolucionVentas && d.evolucionVentas.durante) || 0)], ['Después', Number((d.evolucionVentas && d.evolucionVentas.despues) || 0)]];
      const seguidores = [['Momento', 'Seguidores'], ['Antes', Number((d.evolucionSeguidores && d.evolucionSeguidores.antes) || 0)], ['Después', Number((d.evolucionSeguidores && d.evolucionSeguidores.despues) || 0)]];

      const linea = function(id, filas, titulo, color) {
        const el = document.getElementById(id);
        if (!el) return;
        const chart = new google.visualization.LineChart(el);
        chart.draw(google.visualization.arrayToDataTable(filas), Object.assign({}, base, {
          title: titulo,
          height: 300,
          colors: [color || '#4f46e5'],
          legend: { position: 'none' },
          pointSize: 7,
          curveType: 'function',
          vAxis: { minValue: 0, format: '0' }
        }));
      };
      linea('chartVentas', ventas, 'Evolución de ventas ($)', '#059669');
      linea('chartSeguidores', seguidores, 'Evolución de seguidores Instagram', '#7c3aed');
    });
  }

  function validarRutChileno(rutCompleto) {
    if (!rutCompleto) return { valido: false, mensaje: '' };
    const limpio = String(rutCompleto).replace(/[^0-9kK]/g, '').toUpperCase();
    if (limpio.length < 8 || limpio.length > 9) return { valido: false, mensaje: 'RUT incompleto' };
    const cuerpo = limpio.slice(0, -1);
    const dv = limpio.slice(-1);
    let suma = 0, multiplo = 2;
    for (let i = cuerpo.length - 1; i >= 0; i--) {
      suma += Number(cuerpo[i]) * multiplo;
      multiplo = multiplo < 7 ? multiplo + 1 : 2;
    }
    const res = 11 - (suma % 11);
    const dvEsperado = res === 11 ? '0' : res === 10 ? 'K' : String(res);
    const valido = dv === dvEsperado;
    const formatted = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + dv;
    return { valido: valido, formatted: formatted, dvEsperado: dvEsperado, mensaje: valido ? 'RUT válido' : 'Dígito verificador incorrecto' };
  }

  async function renderInicio(forceRefresh) {

      d = state.boot.dashboard;

      }
    }

        ['Duplicados pendientes', k.posiblesDuplicados, 'accent-teal']

            <div>
              <h2>Consolidado institucional</h2>
              <p class="muted">Panel de control de fomento productivo y gestión de emprendimientos.</p>
            </div>
            <button class="btn btn-secondary" id="dashRefreshV2">Actualizar datos</button>
          </div>
          <div class="quick-actions">

            <button class="btn btn-secondary" data-view="comunicaciones">✉️ Preparar comunicaciones</button>
          </div>
        </div>
        <div class="grid">${items.map(function(x) {
          return `<div class="card kpi ${x[2]}"><strong>${escapeHtml(x[1] || 0)}</strong><span>${escapeHtml(x[0])}</span></div>`;
        }).join('')}</div>
        <div id="dashboardChartInfo" class="alert ok">Los gráficos se actualizan con la información vigente del sistema.</div>
        <div class="dashboard-grid">
          <div class="chart-card"><div id="chartRubro"></div></div>
          <div class="chart-card"><div id="chartFormalizacion"></div></div>
          <div class="chart-card"><div id="chartComunas"></div></div>
          <div class="chart-card"><div id="chartEdades"></div></div>
          <div class="chart-card"><div id="chartVentas"></div></div>
          <div class="chart-card"><div id="chartSeguidores"></div></div>
        </div>
        <div class="panel" style="margin-top:28px">
          <div class="panel-head">
            <div>
              <h2>📊 Dashboard especializado por mercado</h2>
              <p class="muted">Seleccione un mercado individual para analizar asistencia, ventas, impacto digital y apoyos entregados.</p>
            </div>
          </div>
          <div class="filters">
            <select id="dashMarket" style="min-width:320px">
              <option value="">Seleccione un mercado o feria</option>
              ${d.mercados.map(function(m) { return `<option value="${m.ID_INICIATIVA}">${escapeHtml(m.NOMBRE)} (${escapeHtml(dateValue(m.FECHA_EJECUCION) || 'sin fecha')})</option>`; }).join('')}
            </select>
            <button class="btn btn-primary" id="dashMarketBtn">Analizar mercado</button>
          </div>
          <div id="dashMarketResult" class="empty" style="margin-top:16px">Seleccione un mercado para ver sus métricas y gráficos específicos.</div>
        </div>
      `;

      $('#dashRefreshV2').onclick = function() { renderInicio(true); };
      document.querySelectorAll('[data-view]').forEach(function(b) {
        b.onclick = function() { render(b.dataset.view); };
      });
      $('#dashMarket').onchange = function() { if ($('#dashMarket').value) $('#dashMarketBtn').click(); };
      $('#dashMarketBtn').onclick = async function() {
        const id = $('#dashMarket').value;
        if (!id) return;
        $('#dashMarketResult').innerHTML = '<div class="empty">Analizando datos del mercado…</div>';
        try {
          const m = assertOk(await call('apiDashboardMercado', id));
          const kp = m.kpis, vt = m.ventas, sg = m.seguidores;
          const kpiCards = [
            ['Postulaciones recibidas', kp.postulaciones, 'accent-indigo'],
            ['Cupos titulares', kp.titulares, 'accent-teal'],

            ['Venta promedio / puesto', `$ ${Number(vt.promedioDurante || 0).toLocaleString('es-CL')}`, 'accent-amber'],
            ['Nuevos seguidores generados', (sg.totalVariacion >= 0 ? `+${sg.totalVariacion}` : `${sg.totalVariacion}`), 'accent-violet']

          $('#dashMarketResult').innerHTML = `

            <div class="market-charts-grid">

                <div id="chartMercadoRubros" style="height:260px"></div>
              </div>
              <div class="chart-box">
                <h3>📜 Formalización en este mercado</h3>

              </div>
              <div class="chart-box">
                <h3>🤝 Ayudas y apoyos entregados</h3>
                <div id="chartMercadoAyudas" style="height:260px"></div>
              </div>
              <div class="chart-box">
                <h3>⭐ Evaluación de funcionarios</h3>
                <div id="chartMercadoEval" style="height:260px"></div>
              </div>
            </div>

            const rubRows = filasGraficoV2(m.distribucionRubros);

            const formRows = filasGraficoV2(m.distribucionFormalizacion);
            if (formRows.length && document.getElementById('chartMercadoFormalizacion')) {
              const t = google.visualization.arrayToDataTable([['Formalización', 'Cantidad']].concat(formRows));
              new google.visualization.ColumnChart(document.getElementById('chartMercadoFormalizacion')).draw(t, {
                backgroundColor: 'transparent', height: 260,
                colors: ['#0d9488'], legend: { position: 'none' },
                vAxis: { minValue: 0, format: '0' }, hAxis: { slantedText: true, slantedTextAngle: 25 }
              });
            } else if (document.getElementById('chartMercadoFormalizacion')) {
              document.getElementById('chartMercadoFormalizacion').innerHTML = '<div class="empty">Sin datos</div>';
            }

            const ayudaRows = filasGraficoV2(m.distribucionAyudas);
            if (ayudaRows.length && document.getElementById('chartMercadoAyudas')) {
              const t = google.visualization.arrayToDataTable([['Tipo de ayuda', 'Cantidad']].concat(ayudaRows));
              new google.visualization.PieChart(document.getElementById('chartMercadoAyudas')).draw(t, {
                backgroundColor: 'transparent', pieHole: 0.35, height: 260,
                colors: ['#7c3aed', '#2563eb', '#059669', '#f59e0b'],
                legend: { position: 'right' }
              });
            } else if (document.getElementById('chartMercadoAyudas')) {
              document.getElementById('chartMercadoAyudas').innerHTML = '<div class="empty">Sin registros de ayuda</div>';
            }

            const evalRows = filasGraficoV2(m.distribucionEvaluacion);
            if (evalRows.length && document.getElementById('chartMercadoEval')) {
              const t = google.visualization.arrayToDataTable([['Evaluación', 'Cantidad']].concat(evalRows));
              new google.visualization.ColumnChart(document.getElementById('chartMercadoEval')).draw(t, {
                backgroundColor: 'transparent', height: 260,
                colors: ['#059669'], legend: { position: 'none' },
                vAxis: { minValue: 0, format: '0' }
              });
            } else if (document.getElementById('chartMercadoEval')) {
              document.getElementById('chartMercadoEval').innerHTML = '<div class="empty">Sin evaluaciones registradas</div>';
            }
          });
        } catch (e) {
          $('#dashMarketResult').innerHTML = `<div class="alert error">${escapeHtml(e.message)}</div>`;
        }
      };
      dibujarDashboardInteractivoV2(d);
    } catch (e) {
      renderInfo('Panel de gestión', e.message);
    }
  }

  function renderEmprendedores() {
    setActive('emprendedores', 'Emprendedores');
    $('#view').innerHTML = `
      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>Fichas integrales</h2>
            <p class="muted">Cada registro reúne una persona, su emprendimiento, sus documentos y su historial.</p>
          </div>
          <button class="btn btn-primary" data-view="registro">+ Nuevo registro</button>
        </div>
        <div class="filters">
          <input id="fichaQ" placeholder="Buscar por nombre, RUT, correo, teléfono o emprendimiento">
          <select id="fichaRubro">
            <option value="">Todos los rubros</option>
            ${catalogItems('RUBRO').map(function(i) { return `<option value="${escapeHtml(i.CODIGO)}">${escapeHtml(i.ETIQUETA)}</option>`; }).join('')}
          </select>
          <select id="fichaHabilitada">
            <option value="">Toda habilitación</option>
            <option value="SI">Habilitados para mercados</option>
            <option value="NO">Con antecedentes pendientes</option>
          </select>

  async function cargarFichasIntegrales(offset) {
    const target = $('#fichasRows');
    target.innerHTML = '<div class="empty">Cargando…</div>';
    try {
      const d = assertOk(await call('apiListarFichasIntegrales', {
        q: $('#fichaQ').value,
        rubro: $('#fichaRubro').value,
        habilitado: $('#fichaHabilitada').value,
        offset: offset,
        limit: 25
      }));
      target.innerHTML = d.filas.length ? `
        <div class="result-count">${d.total} ficha${d.total === 1 ? '' : 's'}</div>
        <div class="table-wrap">
          <table>
            <thead>

                <th>Emprendedor y emprendimiento</th>
                <th>Contacto</th>

                <th>Documentación base</th>
                <th>Mercados</th>
                <th></th>

            </thead>

                  <td>${escapeHtml(r.EMAIL || r.TELEFONO || '—')}<small class="cell-subtitle">${escapeHtml(r.RUT || '')}</small></td>

                  <td>${statusTag(r.REGISTRO_BASE_COMPLETO === 'SI' ? 'COMPLETO' : 'INCOMPLETO')}</td>
                  <td>${statusTag(r.HABILITADO_MERCADOS === 'SI' ? 'HABILITADO' : 'NO_HABILITADO')}</td>
                  <td><button class="btn-link" data-ficha-id="${escapeHtml(r.ID_PERSONA)}">Abrir ficha</button></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
        ${pagination(d)}
      ` : '<div class="empty">No se encontraron fichas con esos filtros.</div>';

      target.querySelectorAll('[data-ficha-id]').forEach(function(b) {
        b.onclick = function() { renderFichaIntegral(b.dataset.fichaId); };
      });
      target.querySelectorAll('[data-page-offset]').forEach(function(b) {

  function bindDocumentosFichaV210(ref) {
    document.querySelectorAll('[data-ficha-open-doc]').forEach(function(b) {
      b.onclick = async function() {
        const w = window.open('about:blank', '_blank');
        try {
          const x = assertOk(await call('apiObtenerUrlDocumento', b.dataset.fichaOpenDoc));
          if (w) w.location = x.url;
        } catch (e) {
          if (w) w.close();
          alertMsg(e.message, 'error');
        }
      };
    });
    document.querySelectorAll('[data-ficha-replace]').forEach(function(b) {
      b.onclick = function() {
        const s = $('#docFichaTipo');
        if (s) {
          s.value = b.dataset.fichaReplace;
          s.scrollIntoView({ behavior: 'smooth', block: 'center' });
          s.focus();
        }
      };
    });
    document.querySelectorAll('[data-ficha-observe]').forEach(function(b) {
      b.onclick = function() { openReviewDialog(b.dataset.fichaObserve, 'FICHA', ref, ''); };
    });
  }

  async function subirDocumentoFichaV210(p, e) {
    const form = $('#docFichaForm'), select = $('#docFichaTipo'), config = DOCUMENTOS_FICHA_V210.find(function(x) { return x.codigo === select.value; });
    const file = form.querySelector('[name="ARCHIVO"]').files[0];
    if (!file) return alertMsg('Seleccione un archivo.', 'error');
    form.querySelector('[name="TIPO_SUJETO"]').value = config.sujeto;
    form.querySelector('[name="ID_SUJETO"]').value = config.sujeto === 'PERSONA' ? p.ID_PERSONA : e.ID_EMPRENDIMIENTO;
    try {
      assertOk(await callForm('apiCargarDocumentoFormulario', form));
      alertMsg('Documento recibido. Ya cuenta para la habilitación automática.');
      renderFichaIntegral(p.ID_PERSONA);
    } catch (err) {
      alertMsg(err.message, 'error');
    }
  }

          </div>

    // Validación de RUT y advertencia de duplicados en vivo
    const rutInput = $('#completeForm [name="RUT"]');
    const badgeEl = $('#rutStatusBadge');
    const dupEl = $('#rutDuplicateWarning');
    let dupTimer = null;

    if (rutInput) {
      rutInput.oninput = function() {
        const val = rutInput.value.trim();
        const res = validarRutChileno(val);
        if (res.valido) {
          badgeEl.innerHTML = `<span class="rut-badge valid">✓ RUT válido (${res.formatted})</span>`;
        } else if (val.length >= 8) {
          badgeEl.innerHTML = `<span class="rut-badge invalid">✗ ${res.mensaje}</span>`;
        } else {
          badgeEl.innerHTML = '';
        }

        clearTimeout(dupTimer);
        dupEl.innerHTML = '';
        if (val.length >= 7) {
          dupTimer = setTimeout(async function() {
            try {
              const matches = assertOk(await call('apiBuscarPersonas', val));
              const exact = matches.find(function(p) {
                return (p.RUT_NORMALIZADO && p.RUT_NORMALIZADO.replace(/[^0-9K]/gi, '') === val.replace(/[^0-9K]/gi, ''));
              });
              if (exact) {
                dupEl.innerHTML = `
                  <div class="duplicate-warning-box">
                    <span>⚠️ Ya existe una ficha registrada para: <strong>${escapeHtml(exact.NOMBRES + ' ' + exact.APELLIDO_PATERNO)}</strong></span>
                    <button type="button" class="btn btn-secondary btn-small" id="openExistingRegBtn">Abrir ficha</button>
                  </div>
                `;
                const btn = $('#openExistingRegBtn');
                if (btn) btn.onclick = function() { renderFichaIntegral(exact.ID_PERSONA); };
              }
            } catch (ignored) {}
          }, 350);
        }
      };
    }

    $('#saveComplete').onclick = saveRegistroCompleto;
  }

  async function saveRegistroCompleto() {
    const b = $('#saveComplete');
    const form = new FormData($('#completeForm'));
    const all = Object.fromEntries(form.entries());
    const personFields = ['NOMBRES', 'APELLIDO_PATERNO', 'APELLIDO_MATERNO', 'RUT', 'FECHA_NACIMIENTO', 'GENERO', 'DISCAPACIDAD_DECLARADA', 'EMAIL', 'TELEFONO', 'COMUNA_RESIDENCIA'];
    const persona = {}, emp = {};
    personFields.forEach(function(k) { persona[k] = all[k]; delete all[k]; });
    Object.assign(emp, all);
    try {
      if (b) { b.disabled = true; b.textContent = 'Guardando ficha integral…'; }
      const data = assertOk(await call('apiRegistroCompleto', { PERSONA: persona, EMPRENDIMIENTO: emp }));

      renderFichaIntegral(data.persona.ID_PERSONA);
    } catch (e) {
      alertMsg(e.message, 'error');
      if (b) { b.disabled = false; b.textContent = 'Guardar ficha integral'; }
    }
  }

  function pagination(data) {
    if (data.total <= data.limit) return '';
    const prev = Math.max(0, data.offset - data.limit), next = data.offset + data.limit;
    return `
      <div class="pagination">
        <button class="btn btn-secondary" data-page-offset="${prev}" ${data.offset === 0 ? 'disabled' : ''}>Anterior</button>
        <span>${data.offset + 1}–${Math.min(next, data.total)} de ${data.total}</span>
        <button class="btn btn-secondary" data-page-offset="${next}" ${next >= data.total ? 'disabled' : ''}>Siguiente</button>
      </div>
    `;
  }

      return;

    target.innerHTML = '<div class="empty">Buscando…</div>';
    try {

      target.innerHTML = `
        <div class="master-results">

            <div class="panel-head"><h2>Personas</h2><span class="counter">${personas.length}</span></div>

              return `<div class="relation-row"><div><strong>${escapeHtml([p.NOMBRES, p.APELLIDO_PATERNO].filter(Boolean).join(' '))}</strong><small>${escapeHtml(p.RUT_NORMALIZADO || p.EMAIL_NORMALIZADO || 'Sin identificación')}</small></div><button class="btn-link" data-doc-person="${escapeHtml(p.ID_PERSONA)}" data-doc-label="${escapeHtml([p.NOMBRES, p.APELLIDO_PATERNO].filter(Boolean).join(' '))}">Abrir expediente</button></div>`;

        </div>

  async function uploadDocument(tipo, id, label) {
    const form = $('#docUploadForm'), button = $('#uploadDoc'), file = form.querySelector('[name="ARCHIVO"]').files[0];
    if (!file) return alertMsg('Seleccione un archivo.', 'error');
    if (file.size > 10 * 1024 * 1024) return alertMsg('El archivo supera 10 MB.', 'error');
    try {
      if (button) {
        button.disabled = true;
        button.textContent = 'Cargando…';
      }
      assertOk(await callForm('apiCargarDocumentoFormulario', form));
      alertMsg('Documento cargado correctamente.');
      renderExpediente(tipo, id, label);
    } catch (e) {
      alertMsg(e.message, 'error');
      if (button) {
        button.disabled = false;
        button.textContent = 'Cargar documento';
      }
    }
  }

  function bindDocumentActions(tipo, id, label) {
    document.querySelectorAll('[data-open-doc]').forEach(function(b) {
      b.onclick = async function() {
        const win = window.open('about:blank', '_blank');
        try {
          const data = assertOk(await call('apiObtenerUrlDocumento', b.dataset.openDoc));
          if (win) win.location = data.url;
          else window.location.href = data.url;
        } catch (e) {
          if (win) win.close();
          alertMsg(e.message, 'error');
        }
      };
    });
    document.querySelectorAll('[data-review-doc]').forEach(function(b) {
      b.onclick = function() { openReviewDialog(b.dataset.reviewDoc, tipo, id, label); };
    });
  }

  function openReviewDialog(docId, tipo, id, label) {
    const estados = [
      ['RECIBIDO', 'Recibido / sin observaciones'],
      ['VIGENTE', 'Validado voluntariamente'],
      ['OBSERVADO', 'Observado: requiere corrección'],
      ['RECHAZADO', 'Rechazado']
    ];
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-card">
        <h2>Revisar una excepción</h2>
        <p class="muted">La revisión no es obligatoria. Úsela solo para dejar constancia de una observación o validación especial.</p>
        <div class="field">
          <label>Estado</label>
          <select id="reviewState">${estados.map(function(i) { return `<option value="${i[0]}">${i[1]}</option>`; }).join('')}</select>
        </div>
        <div class="field">
          <label>Observación o motivo</label>
          <textarea id="reviewReason"></textarea>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="reviewConfirm">Guardar</button>
          <button class="btn btn-secondary" id="reviewCancel">Cancelar</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector('#reviewCancel').onclick = function() { overlay.remove(); };
    overlay.querySelector('#reviewConfirm').onclick = async function() {
      try {
        assertOk(await call('apiRevisarDocumento', docId, overlay.querySelector('#reviewState').value, overlay.querySelector('#reviewReason').value));

        alertMsg('Estado documental actualizado.');
        tipo === 'FICHA' ? renderFichaIntegral(id) : renderExpediente(tipo, id, label);

        alertMsg(e.message, 'error');
      }
    };
  }

                ${catalogItems('ESTADO_INICIATIVA').map(function(x) { return `<option value="${escapeHtml(x.CODIGO)}">${escapeHtml(x.ETIQUETA)}</option>`; }).join('')}

              <button class="btn btn-primary" id="changeInitiativeState">Cambiar estado</button>
            </div>
          </div>
        </div>
      `;

      $('#newInitiativeState').value = i.ESTADO || 'BORRADOR';

      $('#editInitiative').onclick = function() { renderIniciativaForm(i); };
      $('#newApplication').onclick = function() { renderNuevaPostulacion(id); };
      $('#bulkApplications').onclick = function() { renderPostulacionMasiva(id); };
      $('#evaluateAll').onclick = async function() {
        if (!confirm('Se volverá a evaluar cada postulación activa. ¿Continuar?')) return;
        try {
          const r = assertOk(await call('apiEvaluarAdmisibilidadMasiva', id));
          alertMsg(`Evaluación terminada: ${r.admisibles} admisibles, ${r.subsanables} subsanables y ${r.inadmisibles} inadmisibles.`);
          renderIniciativaDetalle(id);
        } catch (e) {
          alertMsg(e.message, 'error');
        }
      };
      $('#addRequirement').onclick = function() { saveRequirement(id); };
      document.querySelector('[name="CAMPO"]').onchange = updateRuleValueSuggestions;
      updateRuleValueSuggestions();
      $('#changeInitiativeState').onclick = async function() {
        try {
          const newState = $('#newInitiativeState').value;
          const r = assertOk(await call('apiCambiarEstadoIniciativa', id, newState, 'Cambio a ' + newState));
          alertMsg(r.advertencia || 'Estado de la iniciativa actualizado con éxito.');
          renderIniciativaDetalle(id);
        } catch (e) {
          alertMsg(e.message, 'error');
        }
      };
      bindRequirementActions(id);
      bindApplicationLinks();

      if (['MERCADO', 'FERIA'].indexOf(i.TIPO_INICIATIVA) >= 0) {
        renderMercadoExtension(id);
      }

      renderInfo('Gestión de iniciativa', e.message);
    }

  function updateRuleValueSuggestions() {
    const field = document.querySelector('[name="CAMPO"]'), list = $('#ruleValueOptions');
    if (!field || !list) return;
    const map = {
      ID_RUBRO: 'RUBRO',
      ID_SUBRUBRO: 'SUBRUBRO',
      FORMALIZACION: 'FORMALIZACION',
      ETAPA_ACTUAL: 'ETAPA_EMPRENDIMIENTO',
      ESTADO_EMPRENDIMIENTO: 'ESTADO_EMPRENDIMIENTO'
    };
    let values = map[field.value] ? catalogItems(map[field.value]).map(function(x) { return x.CODIGO; }) : ['SI', 'NO'];
    if (field.value === 'GENERO_PERSONA') values = ['MUJER', 'HOMBRE', 'NO_BINARIO', 'OTRO', 'PREFIERE_NO_INFORMAR'];
    if (['TERRITORIO_OPERACION', 'COMUNA_PERSONA'].indexOf(field.value) >= 0) values = [];
    list.innerHTML = values.map(function(v) { return `<option value="${escapeHtml(v)}"></option>`; }).join('');
  }

        TIPO_REGLA: document.querySelector('[name="TIPO_REGLA"]').value,
        CAMPO: document.querySelector('[name="CAMPO"]').value,

  function renderPostulacionMasiva(initiativeId) {
    setActive('postulaciones', 'Incorporar postulaciones');
    $('#view').innerHTML = `
      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>Incorporar varios emprendimientos</h2>

        <div id="bulkResults" class="empty">Cargando emprendimientos…</div>

          <label class="check-box"><input type="checkbox" id="bulkEvaluate" checked> Evaluar admisibilidad inmediatamente</label>
          <button class="btn btn-primary" id="bulkCreate">Incorporar seleccionados</button>

  async function loadBulkCandidates(initiativeId) {
    const target = $('#bulkResults');
    try {
      const rows = assertOk(await call('apiListarCandidatosIniciativa', initiativeId, $('#bulkQ').value));
      target.innerHTML = rows.length ? `
        <div class="bulk-list">
          ${rows.map(function(r) {
            return `
              <label class="bulk-item">
                <input type="checkbox" class="bulk-check" data-emp="${escapeHtml(r.ID_EMPRENDIMIENTO)}" data-contact="${escapeHtml(r.ID_PERSONA_CONTACTO || '')}" ${r.YA_POSTULADO === 'SI' ? 'disabled' : ''}>
                <span>
                  <strong>${escapeHtml(r.NOMBRE_COMERCIAL)}</strong>
                  <small>${escapeHtml(r.CODIGO_EMPRENDIMIENTO || '')} · ${escapeHtml(labelCodeText(r.ID_RUBRO))} · ${escapeHtml(r.NOMBRE_CONTACTO || 'Sin titular')}</small>
                </span>
                ${r.YA_POSTULADO === 'SI' ? '<span class="tag">Ya incorporado</span>' : '<span class="tag">Disponible</span>'}
              </label>
            `;
          }).join('')}
        </div>
      ` : '<div class="empty">No se encontraron emprendimientos.</div>';
    } catch (e) {
      target.innerHTML = `<div class="alert error">${escapeHtml(e.message)}</div>`;
    }
  }

  async function createBulkApplications(initiativeId) {
    const selected = Array.from(document.querySelectorAll('.bulk-check:checked')).map(function(x) {
      return { ID_EMPRENDIMIENTO: x.dataset.emp, ID_PERSONA_CONTACTO: x.dataset.contact };
    });
    if (!selected.length) return alertMsg('Seleccione al menos un emprendimiento.', 'error');
    try {
      const r = assertOk(await call('apiCrearPostulacionesMasivas', initiativeId, selected, $('#bulkEvaluate').checked));
      alertMsg(`Proceso terminado: ${r.creadas} creadas, ${r.duplicadas} duplicadas.`);
      renderIniciativaDetalle(initiativeId);
    } catch (e) {
      alertMsg(e.message, 'error');
    }
  }

  async function buscarEmpPostulacion(initiativeId) {
    const q = $('#applicationEmpQ').value.trim(), target = $('#applicationEmpResults');
    if (q.length < 2) {
      target.innerHTML = '<div class="alert error">Ingrese al menos dos caracteres.</div>';
      return;
    }
    target.innerHTML = '<div class="empty">Buscando…</div>';
    try {
      const rows = assertOk(await call('apiBuscarEmprendimientos', q));
      target.innerHTML = rows.length ? rows.map(function(e) {
        return `<div class="relation-row"><div><strong>${escapeHtml(e.NOMBRE_COMERCIAL)}</strong><small>${labelCodeText(e.ID_RUBRO)} · ${escapeHtml(e.TERRITORIO_OPERACION || 'Sin territorio')}</small></div><button class="btn btn-primary btn-small" data-choose-emp="${escapeHtml(e.ID_EMPRENDIMIENTO)}">Seleccionar</button></div>`;
      }).join('') : '<div class="empty">No se encontraron emprendimientos.</div>';
      target.querySelectorAll('[data-choose-emp]').forEach(function(b) {
        b.onclick = function() { openApplicationDialog(initiativeId, b.dataset.chooseEmp); };
      });
    } catch (e) {
      target.innerHTML = `<div class="alert error">${escapeHtml(e.message)}</div>`;
    }
  }

  async function openApplicationDialog(initiativeId, empId) {
    try {
      const data = assertOk(await call('apiObtenerEmprendimiento', empId));
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-card">
          <h2>Nueva postulación</h2>
          <p class="muted">${escapeHtml(data.emprendimiento.NOMBRE_COMERCIAL)}</p>
          <div class="field">
            <label>Persona de contacto</label>
            <select id="applicationContact">
              <option value="">Sin contacto definido</option>
              ${data.representantes.map(function(r) {
                const p = r.PERSONA || {};
                return `<option value="${escapeHtml(r.ID_PERSONA)}" ${r.ES_PRINCIPAL === 'SI' ? 'selected' : ''}>${escapeHtml([p.NOMBRES, p.APELLIDO_PATERNO].filter(Boolean).join(' '))}</option>`;
              }).join('')}

          </div>
          <div class="field">
            <label>Observaciones</label>
            <textarea id="applicationNotes"></textarea>
          </div>
          <div class="actions">
            <button class="btn btn-primary" id="applicationConfirm">Crear postulación</button>
            <button class="btn btn-secondary" id="applicationCancel">Cancelar</button>
          </div>
        </div>
      `;

      overlay.querySelector('#applicationCancel').onclick = function() { overlay.remove(); };
      overlay.querySelector('#applicationConfirm').onclick = async function() {
        try {
          const saved = assertOk(await call('apiCrearPostulacion', {
            ID_INICIATIVA: initiativeId,
            ID_EMPRENDIMIENTO: empId,
            ID_PERSONA_CONTACTO: overlay.querySelector('#applicationContact').value,

          overlay.remove();

          renderPostulacionDetalle(saved.ID_POSTULACION);
        } catch (e) {
          alertMsg(e.message, 'error');
        }
      };
    } catch (e) {
      alertMsg(e.message, 'error');
    }
  }

  function renderPostulaciones() {
    setActive('postulaciones', 'Postulaciones');
    $('#view').innerHTML = `
      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>Registro de postulaciones</h2>
            <p class="muted">Consulta el avance de admisibilidad de todas las iniciativas.</p>
          </div>
        </div>
        <div class="filters">
          <input id="applicationQ" placeholder="Buscar iniciativa, emprendimiento o contacto">
          <select id="applicationState">
            <option value="">Todos los estados</option>
            ${catalogItems('ESTADO_POSTULACION').map(function(i) { return `<option value="${escapeHtml(i.CODIGO)}">${escapeHtml(i.ETIQUETA)}</option>`; }).join('')}
          </select>
          <button class="btn btn-secondary" id="applicationSearch">Buscar</button>
        </div>
        <div id="applicationResults" class="empty">Cargando…</div>
      </div>
    `;
    let postTimer = null;
    $('#applicationQ').oninput = function() {
      clearTimeout(postTimer);
      postTimer = setTimeout(function() { loadPostulaciones(0); }, 300);
    };

    $('#applicationQ').onkeydown = function(e) { if (e.key === 'Enter') loadPostulaciones(0); };
    $('#applicationState').onchange = function() { loadPostulaciones(0); };
    loadPostulaciones(0);

  async function loadPostulaciones(offset) {
    const target = $('#applicationResults');
    target.innerHTML = '<div class="empty">Cargando…</div>';
    try {
      const data = assertOk(await call('apiListarPostulaciones', {
        q: $('#applicationQ').value,
        estado: $('#applicationState').value,
        offset: offset,
        limit: 25
      }));
      target.innerHTML = data.filas.length ? `${renderApplicationRows(data.filas)}${pagination(data)}` : '<div class="empty">No se encontraron postulaciones.</div>';

      target.querySelectorAll('[data-page-offset]').forEach(function(b) {
        b.onclick = function() { loadPostulaciones(Number(b.dataset.pageOffset)); };
      });
    } catch (e) {
      target.innerHTML = `<div class="alert error">${escapeHtml(e.message)}</div>`;
    }
  }

  async function renderPostulacionDetalle(id) {
    setActive('postulaciones', 'Detalle de postulación');
    $('#view').innerHTML = '<div class="panel empty">Cargando postulación…</div>';
    try {
      const data = assertOk(await call('apiObtenerPostulacion', id));
      const p = data.postulacion, current = data.admisionesVigentes || [], history = data.historialAdmisiones || [];
      $('#view').innerHTML = `
        <div class="panel">
          <div class="panel-head">
            <div>
              <h2>${escapeHtml(p.NOMBRE_EMPRENDIMIENTO)}</h2>
              <p class="muted">Postulación a ${escapeHtml(p.NOMBRE_INICIATIVA)}</p>
            </div>
            <div class="actions compact">
              <button class="btn btn-secondary" id="backApplications">Volver</button>
              ${statusTag(p.ESTADO_POSTULACION)}
            </div>
          </div>
          <div class="detail-grid">
            ${detail('Fecha', dateTimeLabel(p.FECHA_POSTULACION))}
            ${detail('Contacto', p.NOMBRE_CONTACTO)}
            ${detail('Estado', labelCodeText(p.ESTADO_POSTULACION))}
            ${detail('Última actualización', p.ACTUALIZADO_EN)}
          </div>
          <div class="actions">
            <button class="btn btn-primary" id="runEligibility">${current.length ? 'Volver a evaluar' : 'Evaluar admisibilidad'}</button>
            <button class="btn btn-secondary" id="openApplicationEmp">Ver ficha integral</button>
            <button class="btn-link danger" id="withdrawApplication">Retirar postulación</button>
          </div>
        </div>
        <div class="panel current-result">
          <div class="panel-head">
            <div>
              <h2>Evaluación vigente</h2>
              <p class="muted">Resultado determinante de la postulación.</p>
            </div>
            <span class="counter">${current.length}</span>
          </div>
          ${renderAdmissions(current)}
        </div>
        ${history.length ? `
          <div class="panel history-result">
            <details>
              <summary><strong>Historial de evaluaciones anteriores (${history.length})</strong></summary>
              ${renderAdmissions(history)}
            </details>
          </div>
        ` : ''}
      `;
      $('#backApplications').onclick = function() { renderPostulaciones(); };
      $('#openApplicationEmp').onclick = function() { renderFichaIntegral(p.ID_EMPRENDIMIENTO); };
      $('#runEligibility').onclick = async function() {
        if (current.length && !confirm('Se conservará la evaluación anterior en el historial. ¿Volver a evaluar?')) return;

        document.querySelectorAll('.v2Check').forEach(function(c) { c.checked = true; });

      };

        document.querySelectorAll('.v2Check').forEach(function(c) { c.checked = false; });
        updateCounter();
      };

      refresh();
    } catch (e) {
      renderInfo('Selección manual', e.message);
    }
  }

  function downloadConfirmados(rows) {
    const data = rows.filter(function(r) { return r.ESTADO_SEGUIMIENTO === 'CONFIRMADA'; }).map(function(r) {
      return [r.NOMBRE_EMPRENDIMIENTO, r.NOMBRE_CONTACTO, r.CORREO, r.TELEFONO];
    });
    const csv = ['Emprendimiento,Contacto,Correo,Teléfono'].concat(data.map(function(x) {
      return x.map(function(v) { return '"' + String(v || '').replace(/"/g, '""') + '"'; }).join(',');
    })).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'nomina_confirmados.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  }

    const calcSeg = function() {
      const a = Number(overlay.querySelector('#tmSegAntes')?.value || 0);
      const d = Number(overlay.querySelector('#tmSegDespues')?.value || 0);
      const diff = d - a;
      const el = overlay.querySelector('#tmSegCalc');
      if (el) {
        if (diff > 0) {
          el.className = 'follower-calc-badge follower-calc-positive';
          el.textContent = `+${diff} seguidores ganados 🎉`;
        } else if (diff < 0) {
          el.className = 'follower-calc-badge follower-calc-neutral';
          el.textContent = `${diff} seguidores`;
        } else {
          el.className = 'follower-calc-badge follower-calc-neutral';
          el.textContent = 'Sin variación';
        }
      }
    };
    const inAntes = overlay.querySelector('#tmSegAntes');
    const inDespues = overlay.querySelector('#tmSegDespues');
    if (inAntes) inAntes.oninput = calcSeg;
    if (inDespues) inDespues.oninput = calcSeg;
    calcSeg();

        SEGUIDORES_DESPUES: Number(f.querySelector('[name="SEGUIDORES_DESPUES"]').value || 0),

        EVALUACION_FUNCIONARIO: f.querySelector('[name="EVALUACION_FUNCIONARIO"]').value,
        OBSERVACION: f.querySelector('[name="OBSERVACION"]').value
      };
      try {
        if (b) { b.disabled = true; b.textContent = 'Guardando métricas…'; }
        assertOk(await call('apiRegistrarSeguimientoMercado', payload));
        overlay.remove();
        alertMsg('Métricas guardadas exitosamente.');
        loadTrackingV2();
      } catch (err) {
        alertMsg(err.message, 'error');
        if (b) { b.disabled = false; b.textContent = '💾 Guardar métricas'; }
      }
    };
  }

  function inputField(name, label, value, type) {
    return `<div class="field"><label>${label}</label><input name="${name}" type="${type || 'text'}" value="${escapeHtml(value || '')}"></div>`;
  }

  function selectField(name, label, value, options) {
    return `<div class="field"><label>${label}</label><select name="${name}">${options.map(function(o) {
      return `<option value="${escapeHtml(o)}" ${String(o) === String(value || '') ? 'selected' : ''}>${escapeHtml(o ? o.replace(/_/g, ' ') : 'Seleccione')}</option>`;
    }).join('')}</select></div>`;
  }

  function detail(label, value) {
    return `<div class="detail"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value || '—')}</strong></div>`;
  }

  function dateValue(value) {
    if (!value) return '';
    if (value instanceof Date) return value.toISOString().slice(0, 10);
    const s = String(value);
    return s.indexOf('T') >= 0 ? s.slice(0, 10) : s;
  }

  function dateTimeValue(value) {
    if (!value) return '';
    const s = String(value);
    return s.length >= 16 ? s.slice(0, 16) : s;
  }

  function dateTimeLabel(value) {
    if (!value) return '—';
    return String(value).replace('T', ' ').slice(0, 16);
  }

  function statusTag(value) {
    const v = String(value || 'SIN_ESTADO');
    return `<span class="tag status-${escapeHtml(v.toLowerCase())}">${escapeHtml(v.replace(/_/g, ' '))}</span>`;
  }

  function catalogItems(type) {
    return (state.boot && state.boot.catalogos && state.boot.catalogos[type]) || [];
  }

  function catalogSelect(name, label, value, type, allowBlank) {
    const items = catalogItems(type);
    return `<div class="field"><label>${label}</label><select name="${name}">${allowBlank !== false ? '<option value="">Seleccione</option>' : ''}${items.map(function(i) {
      return `<option value="${escapeHtml(i.CODIGO)}" ${String(i.CODIGO) === String(value || '') ? 'selected' : ''}>${escapeHtml(i.ETIQUETA || i.CODIGO)}</option>`;
    }).join('')}</select></div>`;
  }

  function bindSubrubros(scope) {
    const root = typeof scope === 'string' ? document.querySelector(scope) : scope;
    const rubro = root && root.querySelector('[name="ID_RUBRO"]');
    const sub = root && root.querySelector('[name="ID_SUBRUBRO"]');
    if (!rubro || !sub) return;
    const current = sub.value, all = catalogItems('SUBRUBRO');
    const update = function() {
      const allowed = SUBRUBROS_POR_RUBRO[rubro.value] || [];
      sub.innerHTML = '<option value="">Seleccione</option>' + all.filter(function(x) {
        return allowed.indexOf(x.CODIGO) >= 0;
      }).map(function(x) {
        return `<option value="${escapeHtml(x.CODIGO)}">${escapeHtml(x.ETIQUETA || x.CODIGO)}</option>`;
      }).join('');
      if (allowed.indexOf(current) >= 0) sub.value = current;
    };
    rubro.onchange = function() { sub.value = ''; update(); };
    update();
  }

    toast.className = `px-4 py-3 rounded-xl shadow-lg text-xs font-medium flex items-center gap-2 border border-white/10 transition-all transform duration-300 pointer-events-auto ${colorBg}`;

  window.cambiarSeccion = function(seccion) {
    const secciones = ['dashboard', 'fichas', 'nuevo', 'iniciativas', 'seleccion', 'seguimiento', 'expediente', 'turso'];
    secciones.forEach(s => {
      const el = document.getElementById('view' + s.charAt(0).toUpperCase() + s.slice(1));
      if (el) el.classList.add('hidden');
      const btn = document.getElementById('navBtn' + s.charAt(0).toUpperCase() + s.slice(1));
      if (btn) {
        btn.classList.remove('bg-muni-700', 'text-white', 'font-semibold');
        btn.classList.add('text-blue-100');
      }
    });

    const targetEl = document.getElementById('view' + seccion.charAt(0).toUpperCase() + seccion.slice(1));
    if (targetEl) targetEl.classList.remove('hidden');

    const targetBtn = document.getElementById('navBtn' + seccion.charAt(0).toUpperCase() + seccion.slice(1));
    if (targetBtn) {
      targetBtn.classList.add('bg-muni-700', 'text-white', 'font-semibold');
      targetBtn.classList.remove('text-blue-100');
    }

    const titles = {
      dashboard: ['Consolidado Institucional', 'Gestión de fomento productivo y padrón de emprendedores'],
      fichas: ['Padrón Comunal de Emprendedores', 'Consulta de fichas registradas y expedientes digitales'],

      seleccion: ['Selección y Asignación de Emprendedores', 'Evaluación directa por funcionarios y gestión masiva en dos caminos'],
      seguimiento: ['Seguimiento e Impacto Post-Mercado', 'Evaluación masiva en terreno: asistencia, ventas por día y seguidores'],
      expediente: ['Expediente Digital Google Drive', 'Subida organizada de documentación y certificados'],
      turso: ['Base de Datos Turso (libSQL)', 'Pipeline API v2 y sincronización de esquema']
    };

    if (titles[seccion]) {
      const topTitle = document.getElementById('topTitle');

      if (topTitle) topTitle.textContent = titles[seccion][0];
      if (topSubtitle) topSubtitle.textContent = titles[seccion][1];
    }

    if (seccion === 'fichas') {
      cargarListaFichas();

      actualizarDashboardCompleto();

      inicializarVistaSeguimientoMasivo();
    }
  };

  // Validación de RUT en vivo
  window.validarRutInput = async function(input) {
    const feedback = document.getElementById('rutFeedback');
    if (!input || !input.value.trim()) {
      if (feedback) feedback.innerHTML = '';
      return;
    }

    try {
      const res = await call('apiValidarRut', input.value);
      if (res && res.success && res.data) {
        input.value = res.data.rutFormateado;
        if (feedback) {
          feedback.innerHTML = '<span class="text-emerald-600 font-semibold">✓ RUT Válido (' + res.data.rutFormateado + ')</span>';
        }
      } else {
        if (feedback) {
          feedback.innerHTML = '<span class="text-rose-600 font-semibold">✕ ' + (res?.error || 'RUT inválido') + '</span>';
        }

  window.verFichaDetalle = async function(rutOId) {
    if (!rutOId) return;
    const modal = document.getElementById('modalFicha');
    const contenido = document.getElementById('modalContenido');
    const nomTitular = document.getElementById('modalNombreTitular');

    if (contenido) contenido.innerHTML = '<div class="py-8 text-center text-slate-400">Consultando datos relacionales y Drive...</div>';
    if (modal) modal.classList.remove('hidden');

    try {
      const res = await call('apiFichaDetalle', rutOId);
      if (!res || !res.success || !res.data) {
        if (contenido) contenido.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-lg">${escapeHtml(res?.error || 'No fue posible cargar el detalle')}</div>`;
        return;

      window._fichaActualDetalle = res.data;
      const p = res.data.persona || {};
      const emps = res.data.emprendimientos || [];
      const docs = res.data.documentos || [];

      if (nomTitular) nomTitular.textContent = `${p.nombres || ''} ${p.apellidos || ''}`.trim() || 'Ficha de Emprendedor';
      if (rutTitular) rutTitular.textContent = p.rut_formateado || p.rut || '';

      let html = `
        <div class="grid grid-cols-2 gap-3 bg-slate-50 p-3.5 rounded-xl border border-slate-200">
          <div><strong class="text-slate-500">Teléfono:</strong> ${escapeHtml(p.telefono || 'No registra')}</div>
          <div><strong class="text-slate-500">Email:</strong> ${escapeHtml(p.email || 'No registra')}</div>
          <div><strong class="text-slate-500">Comuna:</strong> ${escapeHtml(p.comuna || 'SANTIAGO')}</div>
          <div><strong class="text-slate-500">RSH:</strong> ${escapeHtml((p.tramo_rsh || 'SIN_RSH').replace(/_/g, ' '))}</div>
        </div>

        <div class="border-t border-slate-100 pt-2">
          <div class="font-bold text-slate-700 text-xs uppercase mb-2">Unidad Productiva</div>
          ${emps.length > 0 ? emps.map(e => `
            <div class="p-3 bg-blue-50/50 rounded-xl border border-blue-100 space-y-1 mb-2">
              <div class="font-bold text-blue-900">${escapeHtml(e.nombre_comercial)}</div>
              <div class="text-slate-500">Rubro: ${escapeHtml(e.rubro)} | SII: ${escapeHtml((e.formalizacion_sii || 'SIN_INICIO').replace(/_/g, ' '))}</div>
              ${e.instagram ? `<div class="text-blue-600 font-medium">IG: ${escapeHtml(e.instagram)}</div>` : ''}
            </div>
          `).join('') : '<div class="text-slate-400">Sin unidades productivas registradas.</div>'}
        </div>

        <div class="border-t border-slate-100 pt-2">
          <div class="font-bold text-slate-700 text-xs uppercase mb-2">Expediente Documental en Google Drive</div>
          ${docs.length > 0 ? `
            <div class="space-y-1.5">
              ${docs.map(d => `
                <div class="flex items-center justify-between p-2.5 bg-slate-50 rounded-lg border border-slate-200">
                  <div>
                    <div class="font-semibold text-slate-800">${escapeHtml(d.tipo_documento.replace(/_/g, ' '))}</div>
                    <div class="text-[11px] text-slate-400">${escapeHtml(d.nombre_archivo || 'Archivo Drive')}</div>

                  <a href="${escapeHtml(d.drive_url || '#')}" target="_blank" class="px-2.5 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-[11px] font-bold">

                </div>

  // Iniciar edición completa de un emprendedor
  window.iniciarEdicionFicha = async function(rutOId) {
    if (!rutOId) return;
    mostrarToast('Cargando expediente para edición...', 'info');

    try {
      const res = await call('apiFichaDetalle', rutOId);
      if (!res || !res.success || !res.data) {
        mostrarToast(res?.error || 'No fue posible cargar los datos del emprendedor.', 'error');
        return;
      }

      const p = res.data.persona || {};
      const emps = res.data.emprendimientos || [];
      const emp = emps[0] || {};

      // Cargar IDs de control de edición
      const editIdPer = document.getElementById('editIdPersona');
      const editIdEmp = document.getElementById('editIdEmprendimiento');
      const editRutOrig = document.getElementById('editRutOriginal');
      if (editIdPer) editIdPer.value = p.id_persona || '';
      if (editIdEmp) editIdEmp.value = emp.id_emprendimiento || '';
      if (editRutOrig) editRutOrig.value = p.rut || '';

      // Precargar campos de Persona
      const inRut = document.getElementById('inputRut');
      const inNombres = document.getElementById('inputNombres');
      const inApellidos = document.getElementById('inputApellidos');
      const inTel = document.getElementById('inputTelefono');
      const inEmail = document.getElementById('inputEmail');
      const inComuna = document.getElementById('inputComuna');
      const inTramoRsh = document.getElementById('inputTramoRsh');

      if (inRut) inRut.value = p.rut_formateado || p.rut || '';
      if (inNombres) inNombres.value = p.nombres || '';
      if (inApellidos) inApellidos.value = p.apellidos || '';
      if (inTel) inTel.value = p.telefono || '';
      if (inEmail) inEmail.value = p.email || '';
      if (inComuna) inComuna.value = p.comuna || 'SANTIAGO';
      if (inTramoRsh && p.tramo_rsh) inTramoRsh.value = p.tramo_rsh;

      // Precargar campos de Emprendimiento
      const inNomCom = document.getElementById('inputNombreComercial');
      const inRubro = document.getElementById('inputRubro');
      const inSubrubro = document.getElementById('inputSubrubro');
      const inEsp = document.getElementById('inputEspecialidad');
      const inFormal = document.getElementById('inputFormalizacion');
      const inIg = document.getElementById('inputInstagram');
      const inDesc = document.getElementById('inputDescripcion');

      if (inNomCom) inNomCom.value = emp.nombre_comercial || emp.nombre_fantasia || '';
      if (inRubro && emp.rubro) {
        inRubro.value = emp.rubro;
        actualizarSubrubrosFormulario();
      }
      if (inSubrubro && emp.subrubro) inSubrubro.value = emp.subrubro;
      if (inEsp) inEsp.value = emp.descripcion_producto || '';
      if (inFormal && emp.formalizacion_sii) inFormal.value = emp.formalizacion_sii;
      if (inIg) inIg.value = emp.instagram || '';
      if (inDesc) inDesc.value = emp.descripcion_producto || '';

      // Activar banner visual de Modo Edición
      const banner = document.getElementById('bannerModoEdicion');
      const bannerTxt = document.getElementById('bannerModoEdicionTexto');
      const btnCancel = document.getElementById('btnCancelarEdicionPie');
      const btnTxt = document.getElementById('btnGuardarFichaTexto');
      const tituloForm = document.getElementById('tituloFormFicha');
      const subForm = document.getElementById('subtituloFormFicha');

      if (banner) banner.classList.remove('hidden');
      if (bannerTxt) bannerTxt.textContent = `Actualizando datos de: ${emp.nombre_comercial || p.nombres} (RUT: ${p.rut_formateado || p.rut}). Puede corregir cualquier campo.`;
      if (btnCancel) btnCancel.classList.remove('hidden');
      if (btnTxt) btnTxt.textContent = 'Guardar Cambios Actualizados';
      if (tituloForm) tituloForm.textContent = 'Editar y Actualizar Ficha de Emprendedor';
      if (subForm) subForm.textContent = 'Corrija errores de digitación o actualice información personal y de la unidad productiva.';

      // Navegar a la sección del formulario
      cambiarSeccion('nuevo');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      mostrarToast('Formulario cargado en Modo Edición.', 'success');
    } catch (err) {
      mostrarToast('Error al cargar datos: ' + err.message, 'error');
    }

  // Guardar Formulario Nueva Ficha o Edición
  window.guardarFormularioFicha = async function(e) {
    if (e) e.preventDefault();
    const btn = document.getElementById('btnGuardarFicha');
    if (btn) btn.disabled = true;

    const idPersonaEdit = document.getElementById('editIdPersona')?.value || null;
    const idEmpEdit = document.getElementById('editIdEmprendimiento')?.value || null;
    const rutOrigEdit = document.getElementById('editRutOriginal')?.value || null;
    const esModoEdicion = Boolean(idPersonaEdit || idEmpEdit);

    const payload = {
      idPersona: idPersonaEdit,
      idEmprendimiento: idEmpEdit,
      rutOriginal: rutOrigEdit,
      rut: document.getElementById('inputRut')?.value,
      nombres: document.getElementById('inputNombres')?.value,
      apellidos: document.getElementById('inputApellidos')?.value,
      telefono: document.getElementById('inputTelefono')?.value,
      email: document.getElementById('inputEmail')?.value,
      comuna: document.getElementById('inputComuna')?.value,
      nombreComercial: document.getElementById('inputNombreComercial')?.value,
      rubro: document.getElementById('inputRubro')?.value,
      subrubro: document.getElementById('inputSubrubro')?.value,
      especialidad: document.getElementById('inputEspecialidad')?.value,
      formalizacionSii: document.getElementById('inputFormalizacion')?.value,
      tramoRsh: document.getElementById('inputTramoRsh')?.value,
      instagram: document.getElementById('inputInstagram')?.value,
      descripcion: document.getElementById('inputDescripcion')?.value
    };

    try {
      const res = await call('apiFichaGuardar', payload);
      if (res && res.success) {
        mostrarToast(res.data?.mensaje || (esModoEdicion ? 'Datos actualizados con éxito en Turso.' : 'Ficha guardada con éxito en Turso.'), 'success');
        
        // Resetear modo edición
        cancelarEdicionFicha();
        cargarListaFichas();
      } else {
        mostrarToast(res?.error || 'No fue posible guardar la ficha.', 'error');
      }
    } catch (err) {
      mostrarToast('Error: ' + err.message, 'error');
    } finally {
      if (btn) btn.disabled = false;
    }
  };

  // Subir Documento a Drive y Turso
  window.cargarDocumentoDrive = async function(e) {
    if (e) e.preventDefault();
    const rut = document.getElementById('docRut')?.value;
    const tipo = document.getElementById('docTipo')?.value;
    const fileInput = document.getElementById('docFile');
    const file = fileInput?.files?.[0];

    if (!rut || !tipo || !file) {
      mostrarToast('Complete el RUT, tipo de documento y seleccione un archivo.', 'error');
      return;
    }

    const btn = document.getElementById('btnSubirDoc');
    if (btn) btn.disabled = true;

    try {
      const reader = new FileReader();
      reader.onload = async function(event) {
        const base64Data = event.target.result.split(',')[1];
        try {
          const res = await call('apiExpedienteCargar', {
            rut: rut,
            tipoDocumento: tipo,
            archivo: {
              name: file.name,
              mimeType: file.type,
              base64: base64Data
            }
          });

          if (res && res.success) {
            mostrarToast('Documento guardado en Drive y registrado en Turso.', 'success');
            document.getElementById('formCargaDoc')?.reset();
            cambiarSeccion('fichas');
          } else {
            mostrarToast(res?.error || 'Error al guardar documento.', 'error');
          }
        } catch (err) {
          mostrarToast('Error al cargar documento: ' + err.message, 'error');
        } finally {
          if (btn) btn.disabled = false;
        }
      };
      reader.readAsDataURL(file);
    } catch (err) {
      mostrarToast('Error leyendo archivo: ' + err.message, 'error');
      if (btn) btn.disabled = false;
    }
  };

  // Renderizador de los 6 gráficos
  function renderizar6Graficos(g) {
    if (typeof Chart === 'undefined') {
      console.warn('Chart.js aún no está cargado');
      return;
    }

    const defaultFont = { family: "'Plus Jakarta Sans', sans-serif", size: 11 };

    // --- 1. Rubros Principales (Bar Chart) ---
    const ctxRubros = document.getElementById('chartRubros');
    if (ctxRubros) {
      if (chartInstRubros) chartInstRubros.destroy();
      const rubrosData = g.rubros || [];
      const labels = rubrosData.map(r => r.rubro || 'ARTESANIA');
      const values = rubrosData.map(r => Number(r.cantidad || 0));

      chartInstRubros = new Chart(ctxRubros, {
        type: 'bar',
        data: {
          labels: labels.length ? labels : ['ARTESANIA'],
          datasets: [{
            data: values.length ? values : [1],
            backgroundColor: '#3b82f6',
            borderRadius: 6,
            maxBarThickness: 36
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { font: defaultFont } },
            y: { beginAtZero: true, ticks: { stepSize: 1, font: defaultFont }, grid: { color: '#f1f5f9' } }
          }
        }
      });
    }

    // --- 2. Nivel de Formalización (Bar Chart Teal) ---
    const ctxForm = document.getElementById('chartFormalizacion');
    if (ctxForm) {
      if (chartInstFormalizacion) chartInstFormalizacion.destroy();
      const formData = g.formalizacion || [];
      const labels = formData.map(f => f.etiqueta || 'Sin inicio de actividades');
      const values = formData.map(f => Number(f.cantidad || 0));

      chartInstFormalizacion = new Chart(ctxForm, {
        type: 'bar',
        data: {
          labels: labels.length ? labels : ['Sin inicio de actividades', 'Primera categoría'],
          datasets: [{
            data: values.length ? values : [0, 1],
            backgroundColor: '#0d9488',
            borderRadius: 6,
            maxBarThickness: 36
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { font: defaultFont, maxRotation: 20 } },
            y: { beginAtZero: true, ticks: { stepSize: 1, font: defaultFont }, grid: { color: '#f1f5f9' } }
          }
        }
      });
    }

    // --- 3. Comunas de Residencia (Doughnut Chart) ---
    const ctxComunas = document.getElementById('chartComunas');
    if (ctxComunas) {
      if (chartInstComunas) chartInstComunas.destroy();
      const comData = g.comunas || [];
      const labels = comData.map(c => c.comuna || 'Santiago');
      const values = comData.map(c => Number(c.cantidad || 0));

      chartInstComunas = new Chart(ctxComunas, {
        type: 'doughnut',
        data: {
          labels: labels.length ? labels : ['Santiago'],
          datasets: [{
            data: values.length ? values : [1],
            backgroundColor: ['#005a9c', '#0284c7', '#0d9488', '#c59b27', '#6366f1', '#f59e0b'],
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'right', labels: { boxWidth: 12, font: defaultFont } }
          },
          cutout: '65%'
        }
      });
    }

    // --- 4. Distribución por Edades (Bar Chart Naranja) ---
    const ctxEdades = document.getElementById('chartEdades');
    if (ctxEdades) {
      if (chartInstEdades) chartInstEdades.destroy();
      const rangosOrdenados = ['18-29', '30-44', '45-59', '60+', 'Sin información'];
      const mapaEdades = {};
      (g.edades || []).forEach(e => { mapaEdades[e.rango_edad] = Number(e.cantidad || 0); });

      const values = rangosOrdenados.map(r => mapaEdades[r] || 0);

      chartInstEdades = new Chart(ctxEdades, {
        type: 'bar',
        data: {
          labels: rangosOrdenados,
          datasets: [{
            data: values,
            backgroundColor: '#ea580c',
            borderRadius: 6,
            maxBarThickness: 32
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { font: defaultFont } },
            y: { beginAtZero: true, ticks: { stepSize: 1, font: defaultFont }, grid: { color: '#f1f5f9' } }
          }
        }
      });
    }

    // --- 5. Evolución de Ventas ($) (Line Chart Verde) ---
    const ctxVentas = document.getElementById('chartVentas');
    if (ctxVentas) {
      if (chartInstVentas) chartInstVentas.destroy();
      const vData = g.evolucionVentas || [
        { hito: 'Antes', monto: 200000 },
        { hito: 'Durante', monto: 450000 },
        { hito: 'Después', monto: 350000 }
      ];

      chartInstVentas = new Chart(ctxVentas, {
        type: 'line',
        data: {
          labels: vData.map(v => v.hito),
          datasets: [{
            data: vData.map(v => Number(v.monto || 0)),
            borderColor: '#059669',
            backgroundColor: 'rgba(5, 150, 105, 0.1)',
            fill: true,
            tension: 0.35,
            pointBackgroundColor: '#059669',
            pointRadius: 5,
            pointHoverRadius: 7
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(item) {
                  return '$' + Number(item.raw).toLocaleString('es-CL');
                }
              }
            }
          },
          scales: {
            x: { grid: { display: false }, ticks: { font: defaultFont } },
            y: {
              ticks: {
                callback: function(val) { return '$' + Number(val).toLocaleString('es-CL'); },
                font: defaultFont
              },
              grid: { color: '#f1f5f9' }
            }
          }
        }
      });
    }

    // --- 6. Evolución Seguidores Instagram (Line Chart Violeta) ---
    const ctxSeg = document.getElementById('chartSeguidores');
    if (ctxSeg) {
      if (chartInstSeguidores) chartInstSeguidores.destroy();
      const sData = g.evolucionSeguidores || [
        { hito: 'Antes', cantidad: 120 },
        { hito: 'Después', cantidad: 240 }
      ];

      chartInstSeguidores = new Chart(ctxSeg, {
        type: 'line',
        data: {
          labels: sData.map(s => s.hito),
          datasets: [{
            data: sData.map(s => Number(s.cantidad || 0)),
            borderColor: '#7c3aed',
            backgroundColor: 'rgba(124, 58, 237, 0.1)',
            fill: true,
            tension: 0.35,
            pointBackgroundColor: '#7c3aed',
            pointRadius: 5,
            pointHoverRadius: 7
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { font: defaultFont } },
            y: { beginAtZero: true, ticks: { font: defaultFont }, grid: { color: '#f1f5f9' } }
          }
        }
      });
    }
  }

  async function cargarSelectorIniciativasDashboard(iniciativas) {
    const sel = document.getElementById('selectorMercadoDashboard');
    if (!sel) return;

    let lista = iniciativas;
    if (!lista || lista.length === 0) {
      try {
        const res = await call('apiIniciativasListar');
        lista = (res && res.success && res.data) ? res.data : [];
      } catch (e) {
        console.warn(e);
      }
    }

    if (!lista || lista.length === 0) {
      sel.innerHTML = '<option value="">No hay iniciativas creadas</option>';
      return;
    }

    sel.innerHTML = lista.map(ini => `
      <option value="${ini.id_iniciativa}">${ini.nombre} (${ini.codigo || ''})</option>
    `).join('');

    // Cargar automáticamente el detalle de la primera iniciativa seleccionada
    if (sel.value) {
      cambiarMercadoDashboard(sel.value);
    }
  }

  window.cargarEstadoFormularioOficial = async function() {
    try {
      const res = await call('apiObtenerEstadoFormularioOficial');
      if (res && res.success && res.data) {
        const d = res.data;
        const inputUrl = document.getElementById('inputUrlFormularioPublico');
        const btnVer = document.getElementById('btnAbrirFormPublico');
        const btnCarpeta = document.getElementById('btnAbrirCarpetaDriveForm');

        if (inputUrl) {
          inputUrl.value = d.formUrl || 'Formulario no sincronizado aún. Haz clic en "Sincronizar Ferias".';
        }
        if (btnVer) {
          if (d.formUrl) {
            btnVer.href = d.formUrl;
            btnVer.classList.remove('opacity-50', 'pointer-events-none');
          } else {
            btnVer.href = '#';
            btnVer.classList.add('opacity-50', 'pointer-events-none');
          }
        }
        if (btnCarpeta) {
          if (d.carpetaUrl) {
            btnCarpeta.href = d.carpetaUrl;
            btnCarpeta.title = `Carpeta en Mi Unidad: ${d.carpetaNombre || 'SGE - Formularios Convocatorias'}`;
          } else {
            btnCarpeta.href = '#';
          }
        }
      }
    } catch (e) {
      console.warn('No se pudo cargar estado del formulario oficial:', e);
    }
  };

  window.sincronizarFormularioOficial = async function(btn) {
    let originalText = '🔄 Sincronizar Ferias';
    if (btn) {
      originalText = btn.innerHTML;
      btn.innerHTML = '⏳ Sincronizando en Mi Unidad...';
      btn.disabled = true;
    }

    try {
      const res = await call('apiSincronizarFormularioOficial');
      if (res && res.success && res.data) {
        mostrarToast(`Formulario oficial sincronizado con ${res.data.totalAbiertas} convocatorias abiertas.`, 'success');
        await window.cargarEstadoFormularioOficial();
        await window.cargarIniciativas();
      } else {
        mostrarToast('Error sincronizando formulario: ' + (res ? res.error : 'Sin respuesta'), 'error');
      }
    } catch (err) {
      mostrarToast('Error al conectar con Google Forms: ' + err.message, 'error');
    } finally {
      if (btn) {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }
  };

  window.copiarEnlaceFormularioPublico = function() {
    const input = document.getElementById('inputUrlFormularioPublico');
    if (!input || !input.value || input.value.indexOf('http') < 0) {
      mostrarToast('Primero sincroniza el formulario para obtener el enlace.', 'warning');
      return;
    }
    navigator.clipboard.writeText(input.value).then(() => {
      mostrarToast('Enlace del Formulario copiado al portapapeles.', 'success');
    }).catch(() => {
      input.select();
      document.execCommand('copy');
      mostrarToast('Enlace copiado.', 'success');
    });
  };

  window.guardarNuevaIniciativa = async function(e) {
    if (e) e.preventDefault();
    const idIniciativa = document.getElementById('iniIdIniciativa')?.value;
    const nombre = document.getElementById('iniNombre')?.value;
    const tipo = document.getElementById('iniTipo')?.value || 'FERIA';
    const tematica = document.getElementById('iniTematica')?.value || '';
    const estado = document.getElementById('iniEstado')?.value || 'ABIERTA';
    const objetivo = document.getElementById('iniObjetivo')?.value || '';
    const barrio = document.getElementById('iniBarrio')?.value || '';
    const ubicacion = document.getElementById('iniUbicacion')?.value || 'Santiago';
    const entidadOrganizadora = document.getElementById('iniEntidadOrganizadora')?.value || '';
    const responsable = document.getElementById('iniResponsable')?.value || '';
    const cuposTitulares = parseInt(document.getElementById('iniCuposTitulares')?.value, 10) || 20;
    const cuposSuplentes = parseInt(document.getElementById('iniCuposSuplentes')?.value, 10) || 10;
    const fechaInicioPost = document.getElementById('iniFechaInicioPost')?.value || null;
    const fechaCierrePost = document.getElementById('iniFechaCierrePost')?.value || null;
    const fechaEjecInicio = document.getElementById('iniFechaEjecInicio')?.value || null;
    const fechaEjecFin = document.getElementById('iniFechaEjecFin')?.value || null;
    const urlFormulario = document.getElementById('iniUrlFormulario')?.value || null;

    if (!nombre) {
      mostrarToast('Indique el nombre del mercado o feria.', 'error');
      return;
    }

    const payload = {
      idIniciativa: idIniciativa || undefined,
      nombre: nombre,
      tipo: tipo,
      tematica: tematica,
      estado: estado,
      objetivo: objetivo,
      barrio: barrio,
      ubicacion: ubicacion,
      lugar: ubicacion,
      entidadOrganizadora: entidadOrganizadora,
      responsable: responsable,
      cuposTitulares: cuposTitulares,
      cuposSuplentes: cuposSuplentes,
      fechaInicioPostulacion: fechaInicioPost,
      fechaCierrePostulacion: fechaCierrePost,
      fechaEjecucionInicio: fechaEjecInicio,
      fechaEjecucionFin: fechaEjecFin,
      urlFormulario: urlFormulario
    };

    try {
      const endpoint = idIniciativa ? 'apiIniciativaActualizar' : 'apiIniciativaCrear';
      const res = await call(endpoint, payload);

      if (res && res.success) {
        mostrarToast(idIniciativa ? 'Mercado actualizado exitosamente en Turso.' : 'Mercado registrado exitosamente en Turso.', 'success');
        cerrarModalCrearIniciativa();
        cargarIniciativas();
        cargarSelectorIniciativasSeleccion();
        if (idIniciativa && typeof cambiarMercadoSeleccion === 'function') {
          cambiarMercadoSeleccion(idIniciativa);
        }
      } else {
        mostrarToast(res?.error || 'No se pudo guardar el mercado', 'error');
      }
    } catch (err) {
      mostrarToast(err.message, 'error');
    }
  };
